  v65 (res_v65.html): PARTE 5 (~80%, +30%). TIROTEIO SOBRE A ILHA. (1) Ao chegar na ilha o helicóptero passa a circular em volta dela (raio 88 m, altura 26 m, ~21 m/s, inclinado na curva) com você na cabine; munição reabastecida (+48) e +24 a cada onda. (2) 4 ONDAS: 1) 4 atiradores a pé na estrada em anel; 2) 2 atiradores + 2 carros (gol, civic) que aceleram atrás de você e emparelham; 3) 4 a pé + 2 carros (mustang, lambo); 4) 5 a pé. Cada onda dura no máximo 45 s (se sobrar gente eles recuam). (3) ACERTAR: tiros da pistola acertam alvos por esfera (homem 70 de vida = 2 tiros, carro 130 = 4 tiros), com sangue/faíscas; carro destruído vira bola de fogo escura e para; homem cai. (4) ELES ATIRAM: inimigos em alcance (até 90 m) atiram em você com rastro (1 tiro a cada ~0,2 s no máximo no conjunto, chance 7% a 26% conforme a distância, dano 4-7), usando o sangue na tela da v62. (5) Morrer durante o tiroteio recomeça o tiroteio no helicóptero (não volta ao topo). (6) Falas novas da Emmy c1_emmy_011 (carros), 012 (você com pouca vida), 013 (fim). (7) Ao limpar a 4ª onda o helicóptero se afasta para o oeste e aparece 'Fim do trecho jogável atual'. Falta da Parte 5: cena final com as revelações da Emmy (a Emmy ainda não aparece a bordo) e acabamento.
  v64 (res_v64.html): PARTE 5 (~50%, +30%). HELICÓPTERO E CORDA. (1) O helicóptero some do topo no começo; depois da ligação da Pen no topo (ev 'topo', que agora é checkpoint 'Topo') ele vem voando do mar com som de rotor, desacelera e fica parado a 6,5 m do chão. (2) Uma corda comprida (7,3 m, com nós e laço) desce da porta direita. (3) VR: segure com o GRIP perto da corda e puxe as mãos para baixo para subir (mão sobre mão; se soltar com as duas mãos você cai e leva dano se a queda for alta). No celular/tela: chegue perto da corda ~1 s que sobe sozinho. (4) Ao chegar na porta: tela escurece, você aparece dentro do helicóptero (Emmy some, já está a bordo) e ele decola e voa para a ilha, parando sobre ela. Esse trecho final é provisório: aparece 'Fim do trecho jogável atual'. Falta da Parte 5: tiroteio em alta velocidade sobre a ilha (carros e inimigos), cena final com as revelações da Emmy, e a Emmy visível subindo/dentro do helicóptero.
  v63 (res_v63.html): PARTE 5 (~20%). (1) FUGA COM HORDAS: ao sair da base com a Emmy (evento 'saida') uma horda de grandes (fuga1) aparece no pasto ~3 s depois e vem direto em vocês; ao chegar no novo checkpoint 'Fuga' (25,-295) vem a segunda (fuga2); a da colina continua no evento 'colina'. (2) Aviso 'Horda eliminada' quando um grupo inteiro morre (S.hg). (3) Mais 2 caixas de munição na subida da colina. (4) LIGAÇÃO DA PEN NO TOPO: com a Emmy junto, o evento 'topo' dispara a fala c1_pen_004 avisando do helicóptero (o helicóptero em si e a corda comprida ainda NÃO foram feitos). Falta da Parte 5: chegada do helicóptero, corda e subida em VR, tiroteio sobre a ilha, cena final.
  v62 (res_v62.html): SANGUE NA TELA (modo história). Quando o jogador está machucado a tela ganha uma borda vermelha escura (vinheta) e respingos/escorridos de sangue nas bordas; quanto menos vida, mais forte (começa abaixo de ~70 de vida). Cada ferida dá um clarão vermelho que some em ~1,5 s. Abaixo de 40 de vida pulsa como batimento (mais rápido abaixo de 20). Some sozinho conforme a vida regenera e some durante a tela de morte (que tem o vermelho dela). Funciona no celular e no VR (planos presos à câmera, S.bl).
  v61 (res_v61.html): PARTE 4 CONCLUÍDA (+25%). (1) INIMIGOS ATIRAM NA EMMY: atiradores em alerta, com linha de visão e a até 26 m dela, atiram nela quando ela está mais perto que você (ou você está longe); brutos batem nela de perto. Ela agora tem vida própria (S.eh, 100): leva 6-10 por tiro e 9 por soco, regenera depois de ~8 s sem ser ferida. Se ela cai a 0, aparece 'Emmy caiu' e roda a tela de morte (a missão é salvá-la), voltando ao checkpoint com ela inteira. (2) Gritos novos c1_emmy_009 (ela é atingida) e c1_emmy_010 (vida baixa), com recarga de 10 s. (3) Aviso na tela 'Emmy ferida' quando a vida dela fica abaixo de 35. (4) Respawn restaura a vida dela. Falta (outras partes): balanceamento e testes (Parte 6), fuga e hordas (Parte 5).
  v60 (res_v60.html): PARTE 4 (~75%, +25%). (1) ALARME DA BASE: quando um inimigo da base entra em alerta, os outros da base a até 34 m também (vão até onde você estava) e os holofotes varrem 1,8x mais rápido; acalma depois de ~25 s sem ninguém em alerta. (2) INIMIGOS REAGEM À EMMY: calmos que veem a Emmy a menos de 11 m (cone de visão, sem parede) enchem a barra de detecção devagar (0,6/s no máximo) e vão até onde ela está; ela agora é um risco para o furtivo. (3) EMMY ATRAVESSA A BASE: caminho por waypoints pela porta do prédio (80,-350) e pela abertura da divisória (80,-370), então não trava nas paredes (S.via). (4) Grito novo c1_emmy_008 quando o jogador faz um abate furtivo perto dela. (5) Novo checkpoint "Saída da base" em (80,-318), só vale depois de a Emmy ser solta (evento com cond). Falta: inimigos poderem atirar e ferir a Emmy, balanceamento e testes (Parte 6).
   v59 (res_v59.html): PARTE 4 (~50%, +20%). EMMY COMPANHEIRA: depois da cena da pistola ela passa a seguir o jogador (fica ~3 m atrás e ao lado, acelera se ficar longe, se trava ou fica a mais de 30 m ou o jogador volta de checkpoint ela é teleportada para perto) e ATIRA nos inimigos que já estão em alerta (alcance 30 m, só com linha de visão, ~1 tiro por segundo, 65% de acerto, 35 de dano, com rastro, som e reação do corpo do inimigo). Ela não ataca quem ainda está calmo, para não estragar o furtivo. Gritos novos c1_emmy_005..007 (alerta e morte, com recarga de 10 s). Emmy continua invulnerável e os inimigos ainda só miram no jogador. Falta: afinar infiltração e abates na base e fechar a saída da base.
   v58 (res_v58.html): PARTE 4 (~30%, +20%). (1) HOLOFOTES: 4 torres da base varrem o pátio com feixe de luz (cone aditivo); se o feixe pega o jogador por ~1,2 s (agachado demora mais) os inimigos a até 40 m ficam em alerta indo até onde você estava; tem recarga de 8 s. (2) CENA DA EMMY: ao chegar na porta da cela ela abre, Emmy sai andando até uma mesinha, pega a pistola dela (arma aparece na mão e o braço sobe), manda o jogador ir na frente e sai para perto da porta olhando para ele. 4 falas novas c1_emmy_001..004 (na LISTA DE FALAS). Ela não agradece. Falta: Emmy seguir o jogador e atirar, afinar infiltração e abates.
   v57 (res_v57.html): (1) TELA DE MORTE estilo GTA no modo história: ao morrer, tela fica vermelha, aparece "SE FUDEU" grande (entra com zoom), som grave descendente, o jogador fica parado ~3 s, escurece e volta ao checkpoint (S.die/S.doRespawn; plHurt continua chamando resetAll → S.respawn). (2) PARTE 4 (~10%): os 6 inimigos da base ganharam rotas com pausas (portão, lateral oeste, sala da frente, sala dos fundos) e novo checkpoint "Prédio" na sala da frente. Nada de falas novas (a bíblia ainda não define). Falta o resto da Parte 4.
   v56 (res_v56.html): PARTE 3 CONCLUÍDA (Ato 1 jogável de ponta a ponta). (1) ABATE FURTIVO afinado no acampamento: os 3 inimigos nascem de costas para quem sobe, andam em rotas curtas e PARAM olhando para longe do caminho (janelas para atacar por trás), notam 25% mais devagar (o.dm=.75) e o acampamento ganhou cobertura (2 barracas, 3 caixas de madeira, fogueira). (2) FACA: o jogador começa sem equipamento, então há UMA FACA num toco ao lado do caminho, antes do acampamento (SUPOSIÇÃO do Claude, a confirmar com o usuário); pega-se com o GRIP e vai para a bainha como no modo teste. (3) PISTOLA FÍSICA: a pistola fica deitada em cima da caixa verde do acampamento; no Quest pega-se com o GRIP (sem pegar automático); os 20 tiros = 12 no pente + 8 no bolso (o bolso começa vazio). (4) SUBIDA: andar fica mais lento em ladeira (S.cfg.walk varia com a inclinação). (5) PATRULHAS DO PASTO: 2 duplas andando juntas em rotas (S.route), além dos 3 do pasto. (6) ECONOMIA DE MUNIÇÃO: bolso limitado a 6 pentes (S.addAmmo completa pentes pela metade e respeita o limite); caixas dão +12, munição solta no chão do pasto +6, inimigos dropam 4 a 8; caixa/munição cheia fica no lugar para voltar depois. (7) Morrer devolve faca (bainha) e pistola (coldre) e garante ao menos 8 tiros no bolso. (8) Fogueira com chama tremendo (sem luz extra, por desempenho).

   v54 (res_v54.html): VISUAL DA EMMY (sem mudar jogabilidade). Cabelo loiro com raiz mais escura e pontas claras (balayage), mechas platinadas e mais mechas na frente; olhos azuis; rosto com sardas, pintinha, blush, batom rosado e sobrancelhas loiras (textura própria só dela); top cropped branco com friso rosa, mini saia plissada rosa com barra branca, pernas e barriga de fora, tênis branco; brincos de argola com pérola, tiara de cetim rosa com laço, gargantilha com pingente, corrente dourada, xuxinha no pulso esquerdo e pulseiras douradas no direito. Novos parâmetros do look (L.ex, L.eye, L.hc, L.tip, L.hl, L.fr, L.crop, L.trimC, L.acc) reutilizáveis em outros personagens.
   v53 (res_v53.html): PARTE 2 CONCLUÍDA. (1) EMMY com modelo real (corpo/rosto/cabelo longo loiro com física, como as outras mulheres), parada na cela, aliada (o.ally: fora do sistema de detecção; vida enorme). (2) INIMIGOS GRANDES de verdade: a cápsula física agora acompanha a escala (L.s>.97), a horda da colina usa escala 1,08/1,14 e 150 de vida. (3) PATRULHAS: inimigos calmos andam em rota própria (o.pat), pasto com raio maior; alerta/procura/retorno continuam como antes. (4) Helicóptero do topo com corda amarrada na porta (provisória, curta, Parte 5 estende) e colisão. (5) Carros na estrada da ilha (RESCAR.mk). (6) Pontos de horda para a Parte 5 (S.hordePts). (7) Piso da base mais rente ao terreno (pés não afundam tanto).

   v46 (res_v46.html): MODO HISTÓRIA, PARTE 1 (estrutura e mapa). JOGAR agora abre o capítulo 1 (o MODO TESTE continua igual). Novo: mapa do cap. 1 (morro com subida, mar, pasto, base iluminada com cela da Emmy, colina final, ilha), terreno com física, eventos/checkpoints, legenda + quadradinho azul da Pen, fila de falas com voz opcional, jogador SEM equipamento. Veja NOTAS TÉCNICAS DA PARTE 1 na bíblia.

   v44b: CORREÇÕES após teste no Quest. (a) ESPINGARDA TRAVAVA o jogo ao soltar/segurar com duas mãos: o release() não conhecia os tipos 'shg' e 'fgrp' da espingarda (gerava erro e o loop de animação do VR morria); corrigido, e o loop agora é protegido por try/catch (um erro não congela mais tudo). (b) INIMIGOS só mexiam a cabeça: o material do corpo (SkinnedMesh) estava sem skinning:true (three r128); corpo, braços e pernas voltam a animar. (c) PENTE: encaixe na pistola mais tolerante (raio maior e matriz da arma atualizada). (d) FACA em QUALQUER mão (a que pegar); mão vazia some quando a faca está na direita. (e) ARMAS COM QUALQUER MÃO: se você aperta o grip e não pega nada com as duas mãos livres, o layout ESPELHA (coldre, bolso, bainha, armas das costas e mão principal trocam de lado) e tenta de novo. (f) CORES mais fortes: exposição menor, luz ambiente menor, reflexo do céu mais escuro/azulado, saturação +55% e leve contraste no shader final.
   v44 (res_v44.html): (1) BALANÇAR DE BRAÇOS no VR corrigido: velocidade das mãos medida em espaço local do rig (andar com o analógico não alimenta mais o sprint), com dt sem hit-stop, só movimento ALTERNADO frente/trás, ignorando mão ocupada (arma/objeto/faca). (2) FACA no VR: ESTOCADA com resistência. A ponta entra com dificuldade (empurrão lento emperra, rápido penetra; quanto mais fundo, mais duro), o cabo/guarda NÃO entra (a lâmina para no limite e o controle vibra), puxar para trás tira a faca. Com a faca enfiada ou só raspando a superfície dá pra RASGAR: mover a mão de lado abre o corte (superficial = corte leve; fundo = rasgo pesado, pode decepar membro e matar). Arrancar de lado com força rasga e solta a faca. Golpes de varrer (talho) continuam como antes.
   v43 (res_v43.html): DESEMPENHO (Quest 2), sem mudar o visual. (1) LUZES: eram 4 luzes pontuais (pistola, espingarda, sniper, AK) ligadas o tempo todo, mesmo apagadas, e cada pixel de cada material calculava as 4. Agora existe UMA luz de clarão compartilhada que se move para o cano da arma que atirou (mesma cor, alcance e intensidade). (2) SOMBRAS: no VR o mapa de sombras é redesenhado em quadros alternados (metade do custo de sombra; a diferença de 1 quadro não é perceptível). No celular continua todo quadro. (3) FOVEAÇÃO do Quest em 0,5 (só reduz a resolução bem na borda da lente; constante XR_FOVEATION no topo do JS, 0 desliga). Não altera cores, luzes do ambiente, sombras, resolução central nem modelos.
   v42 (res_v42.html): (1) MÃO DIREITA no Quest 2: garantia reforçada. Todo quadro em VR o jogo confere se a mão direita está presa ao controle direito (se o Quest trocou/reconectou os controles, ela é religada sozinha; se o controle direito ainda não foi identificado, usa o segundo controle), força a visibilidade do controle, da mão e de todas as malhas (sem corte de câmera) e deixa a pele da mão mais clara/emissiva para não sumir em áreas escuras. (2) CORES DE DIA: céu azul com nuvens, sol branco-quente alto, luz de preenchimento forte (sem sombras pretas), neblina clara e leve, chão/paredes/caixotes/barris/coberturas mais claros e saturados, exposição e saturação maiores.
   v36 (res_v36.html): CORREÇÃO VR: a mão direita (e a arma/objetos presos nela) sumia no Quest. Causa: fora do VR o jogo esconde o grupo da mão direita quando a arma está na bancada e, ao entrar no VR (ou reentrar), nada o tornava visível de novo. Agora no VR a mão direita fica sempre visível (loop, place() e handsBack()).
   v35 (res_v35.html): HELICÓPTERO (só o exterior, parado, sem entrar): fuselagem, cabine de vidro, cauda, esquis, rotor principal e de cauda girando, sobre um heliponto à direita e à frente (x 11, z -13). Sem colisão.
   v34 (res_v34.html): CORDA DE ESCALAR (só Quest). Pórtico de aço com colchão perto do início (à esquerda, atrás). Corda de 6 m com física Verlet (balança, tem inércia, empurrada pelas mãos, nós a cada ~1 m). Grip perto da corda = agarra; puxar a mão pra baixo sobe o corpo, alternando as mãos escala de verdade; soltar o grip solta (cai com gravidade, mantém o impulso do balanço, vibração no impacto). Segurado, o analógico de andar fica desligado.
   v33 (res_v33.html): CARROS (sistema copiado do index.html; o Index não foi alterado). 8 carros: Fusca, Chevette, Gol, Civic, Mustang, 911, Lamborghini, Ferrari, com o mesmo catálogo (velocidade máx., 0-100, cv, motor, som). EXTERIOR: carroceria extrudada pelo perfil lateral, vidros, rodas com pneu/aro/disco, faróis, lanternas, grade, placa, retrovisores, frisos. INTERIOR (só aparece sentado): painel, bancos, teto, pedais, câmbio, volante que gira, quadro com velocímetro e conta-giros funcionando, retrovisor interno e externos (câmera traseira), maçaneta de saída. DIREÇÃO: mesma física do Index (aceleração do catálogo, resistência, freio e ré, câmbio/rpm, curva que fecha com a velocidade, aderência lateral, o volante volta ao centro) e som de motor sintetizado. As constantes de sensibilidade ficaram reunidas em CFG (RESCAR) pra ajustar. CELULAR: botões ACELERAR, FREIO/RÉ, ESQ, DIR; ENTRAR NO CARRO aparece perto da porta, SAIR DO CARRO com o carro parado, TROCAR CARRO perto do carro. Teclado: W/S, A/D, E entra e sai, C troca. QUEST: B acelera, A freia/dá ré, grip no volante gira, maçaneta da porta (grip ou mão parada) sai, mão no botão ENTRAR por 0,9 s entra; as armas/grips ficam desligados enquanto dirige. ARENA: o carro bate nas paredes, na bancada e nas muretas, e empurra caixas, barris e inimigos (corpo físico). O carro fica estacionado perto do início (à direita), com um painel ao lado pra escolher o carro (mão nas setas por 0,6 s no Quest); a escolha fica salva no aparelho. Fora do que veio do Index: sem GPS, combustível, passageiros e cidade (não existem no Res).

   - Sem poluição na tela: evitar HUD, textos, botões e avisos desnecessários.

 ===== MODO HISTÓRIA: BÍBLIA DO PROJETO (instrução permanente para o Claude, vale em TODAS as conversas) =====
 LEIA ESTE BLOCO INTEIRO ANTES DE MEXER NO MODO HISTÓRIA. O usuário constrói o modo história em várias conversas, uma parte por vez. Nada se perde: tudo que importa está aqui.

 --- PRINCÍPIOS FIXOS ---
 P1. VOZES: o usuário gera as vozes na Arena IA. Eu entrego um prompt grande com todas as vozes (personagem, tom de voz, texto da fala e NOME EXATO do arquivo). O usuário gera e coloca tudo numa pasta. No index eu só deixo o código pronto para tocar cada arquivo na hora certa (gatilho, legenda, volume, fila para não sobrepor falas, e a falha de arquivo ausente NÃO pode travar o jogo).
     Convenção de nomes (manter sempre): pasta "vozes/", arquivo "c1_<personagem>_<NNN>.mp3" (c1 = capítulo 1; ex.: c1_pen_001.mp3, c1_emmy_014.mp3, c1_inimigo_007.mp3). Nunca renomear arquivo já combinado. Cada parte registra suas falas numa LISTA DE FALAS no fim deste bloco (id, personagem, tom, texto, gatilho), para a Parte 7 montar o prompt final sem esquecer nada.
 P2. LINGUAJAR: jogo ADULTO. Muito palavrão, personagens com personalidades fortes e bem diferentes entre si. O JOGADOR (Davi) NUNCA TEM FALAS: ele é mudo, só os outros falam com ele ou sobre ele.
 P3. VÁRIAS CONVERSAS: é impossível fazer um capítulo inteiro numa conversa só. O usuário continua cada parte em uma conversa nova, enviando o último res_vN.html. Ao terminar uma parte: salvar como novo arquivo res_v(N+1).html (regras de versionamento acima), atualizar o STATUS DAS PARTES abaixo e a LISTA DE FALAS. Nunca pular parte nem refazer parte já concluída sem o usuário pedir.
 P4. Reaproveitar os sistemas que o jogo já tem (furtivo e detecção, abate por trás com faca, tipos de inimigos, armas, VR no Quest + celular, tela limpa sem botões). O modo história se apoia neles, não reescreve. Desempenho no Quest 2 continua sendo prioridade.
 P5. O que o usuário não definiu, eu não invento na história. Se faltar decisão importante, pergunto ou proponho e espero aprovação.

 --- PERSONAGENS ---
 DAVI (o jogador): conhecido como "Ceifador". Contratado pelo governo americano para missões muito difíceis. Sem falas. No começo do capítulo 1 está sem memória (pulou do helicóptero) e sem nenhum equipamento.
 EMMY: garota loira, voz fina, temperamento de patricinha, estressada. Será companheira de Davi no futuro. Em NENHUM momento agradece ou se curva ao jogador, mesmo aliviada por ter sido salva.
 PEN: mulher negra, do governo, acompanha a missão pelo rádio/escuta. Aparece na tela como um quadradinho pequeno AZUL (retrato em miniatura) quando fala.
 INIMIGOS: membros da facção que Emmy investigava. Vários tons de voz para gritos, alerta, procura, reação a corpo encontrado, morte.

 --- HISTÓRIA DO CAPÍTULO 1 (resumo fiel do que o usuário definiu) ---
 1. ABERTURA: Davi acorda a céu aberto, de dia, com sol, vista para o mar. Está sem equipamento nenhum. Precisa subir um morro.
 2. ACAMPAMENTO: subindo o morro e andando um pouco, encontra 3 inimigos andando. O jogo deve dar a OPORTUNIDADE DO ABATE FURTIVO. No acampamento deles há uma pistola e 20 munições.
 3. PEN: o jogador segue reto pelo caminho até a escuta voltar a funcionar. Pen aparece no quadradinho azul, pergunta se o Ceifador está bem e diz que ele pulou do helicóptero e deve ter perdido a memória. A missão: salvar a Emmy, que foi investigar a facção e parou de dar notícia.
 4. PASTO: mais combates, grupos de inimigos andando no pasto verde. Munição de pistola espalhada em caixas e pelo chão. Inimigos dão grana e munição de pistola ao morrer.
 5. BASE: o jogador entra numa base ILUMINADA (não é sombria nem escura). Vai eliminando inimigos andando pela base até achar a Emmy, trancada atrás de uma porta.
 6. EMMY SOLTA: criar as falas dela. Ela pega uma pistola (animação) e manda o jogador segui-la.
 7. FUGA PELO PASTO: os dois saem da base e voltam ao pasto, onde começam a vir HORDAS de inimigos grandes que já sabem que ambos estão ali. Vão subindo até o topo da colina, se escondendo e enfrentando inimigos.
 8. HELICÓPTERO: Pen liga de novo avisando que mandou um helicóptero. Ele chega. O jogador sobe pela corda com MOVIMENTOS REAIS (VR).
 9. FINAL: voando perto da ilha, em alta velocidade, o jogador troca tiros com inimigos da ilha, de carro e a pé, até conseguirem fugir. A missão acaba.
 10. ENCERRAMENTO: Emmy revela algumas coisas sobre a facção e está aliviada por ter sido salva, mas não agradece nem se dobra ao jogador.

 --- AS 7 PARTES (cada uma em uma conversa separada, nesta ordem) ---
 PARTE 1: ESTRUTURA E MAPA. Esqueleto do modo história (entrada pelo menu, carregar cena, gatilhos de eventos, checkpoints, sistema de legenda e do quadradinho azul da Pen). Criação do mapa do capítulo 1: terreno, morro com subida, mar à vista, sol, pasto verde, colina final, a base iluminada (exterior e interior), trecho da ilha para o final. Tudo leve para o Quest 2.
 PARTE 2: CRIAÇÃO E LOCALIZAÇÃO DE TUDO. Posicionar no mapa: ponto onde Davi acorda, acampamento dos 3 inimigos com a pistola e as 20 munições, patrulhas do pasto, caixas e munição no chão, inimigos da base, porta trancada da Emmy, rota da fuga, pontos de horda, ponto do helicóptero. Criar os modelos de Emmy, Pen (retrato), inimigos grandes, helicóptero com corda, carros da ilha. Sistema de grana e munição dropada pelos inimigos.
 PARTE 3: ATO 1 JOGÁVEL (abertura até a Pen). Davi acordando, subida do morro sem equipamento, abate furtivo dos 3 inimigos, pegar a pistola, caminhada até a escuta voltar e a primeira fala da Pen. Patrulhas do pasto e economia de munição.
 PARTE 4: ATO 2 JOGÁVEL (base e Emmy). Infiltração na base iluminada, eliminação dos inimigos andando pela base, porta da Emmy, cena dela pegando a pistola (animação) e mandando seguir. Emmy como companheira que segue e atira.
 PARTE 5: ATO 3 JOGÁVEL (fuga e final). Saída da base, hordas de inimigos grandes, subida da colina se escondendo, ligação da Pen, helicóptero, subida pela corda com movimentos reais no VR, tiroteio em alta velocidade contra carros e inimigos da ilha, cena final com as revelações da Emmy.
 PARTE 6: PROCURAR BUGS. Revisão do capítulo inteiro de ponta a ponta: gatilhos que não disparam, travamentos (try/catch no loop VR continua obrigatório), furtivo e detecção, desempenho no Quest 2, celular, checkpoints, balanceamento de munição e grana, falas sobrepostas.
 PARTE 7: PROMPT DE FALAS E INTEGRAÇÃO. Eu entrego ao usuário UM prompt grande para a Arena IA com todas as vozes: personagem, tom de voz, texto e nome exato do arquivo (usando a LISTA DE FALAS). Depois que o usuário gerar a pasta "vozes/", combinamos tudo com o jogo e testamos os gatilhos de áudio.

 Segundo bloco de script no fim do arquivo = módulo STORY (objeto global STORY, stub no começo do 1º script). Ganchos no jogo base: loop (altura do chão, velocidade STORY.cfg.walk=1.7, STORY.clamp, STORY.tick), resetAll (vira STORY.respawn), stain (altura), HELI.g e ROPE.vis (escondidos no modo história), plHurt morre e volta ao checkpoint.
 Terreno: grade 4 m, X -160..220, Z -470..110, malha com cor por vértice, física Ammo btHeightfieldTerrainShape (se falhar cai para chão plano, aviso no terminal). STORY.gy(x,z) = altura do chão (bilinear). Mar = plano em y=0. Câmera far=700, névoa .0016.
 Pontos (STORY.pts, [x,z]): spawn(-30,38) camp(18,-118) pen(34,-178) pasto(22,-285) gate(80,-334) base(80,-362) emmy(91,-383) colina(-45,-300) topo(-70,-310, plano para o helicóptero) ilha(-430,-300). Caminho de terra: STORY path nas cores do terreno (PATH). Base: cerca + prédio iluminado, pontos de luz internos, cela da Emmy atrás da porta id 'emmy' (STORY.door('emmy') abre). Ilha: terreno + estrada em anel + prédios, sem física (Parte 2/5 completa).
 Eventos: STORY.ev = lista {id,x,z,r,name,fn}; com name vira checkpoint. Legenda: STORY.say('pen'|'emmy'|'ini'|'sis', texto, {dur, voice:'c1_pen_001.mp3'}); fila sem sobreposição, voz opcional em vozes/ (arquivo ausente não trava). Pen aparece como quadradinho azul 3D preso à cabeça. Debug: STORY.cfg.debug=true mostra avisos de eventos (desligar na Parte 6). Celular: botão 'próx. ponto'; teclado: teclas 1..6 pulam para checkpoints.
 NÃO FEITO na Parte 1 (fica para as próximas): inimigos, itens, grana, modelos de Emmy/Pen/helicóptero/corda/carros, falas reais, colisão de árvores/pedras (só visual).
