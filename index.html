 v96 (res_v96.html): SÓ DOCUMENTAÇÃO, nenhuma mudança de jogabilidade, mapa ou código do jogo. Adicionada a BÍBLIA DO CAPÍTULO 2 (história completa, as 7 partes com o que cada uma faz, decisões pendentes, status e lista de falas vazia com prefixo c2_). Título, meta e RES_VERSION atualizados.
   v95 (res_v95.html): VEÍCULOS COM HP E FASES DE DESTRUIÇÃO (carro da arena, modo TESTE). O carro tem 500 de HP e leva dano dos tiros (pistola 12, AK 20, sniper 60, espingarda 7 por chumbo; os furos de bala ficam presos no carro). FASES: até 66% do HP = FUMAÇA clara no capô; até 33% = FUMAÇA ESCURA + FOGO (o fogo consome o carro sozinho, 8 de HP/s, e machuca quem está dirigindo); HP zero = fogo e fumaça forte por 2,2 s e EXPLOSÃO: bola de fogo, fumaça preta, faíscas, estrondo, onda de choque que arremessa e fere inimigos, caixas e barris num raio de 10 m e mata quem estiver dentro do carro (a explosão também machuca o jogador por perto). Sobra a carcaça carbonizada (escurecida, inclinada, com mancha no chão) que ainda queima e solta fumaça por algum tempo; não dá mais para entrar. Botão Resetar ou TROCAR CARRO consertam/trocam o carro. Os carros da ilha (modo história) ficam como estavam.
   v94 (res_v94.html): LOJA (só no modo TESTE, ainda não está no capítulo 1). Loja na parede oeste da arena (x -26, z 14), frente voltada para o centro: prédio com balcão/janela, telhado, placa LOJA, lanternas, prateleiras com facas, munição, pistolas, silenciadores, pentes, miras, AK, sniper e espingarda, rifles e coletes nas paredes, caveira e vela no balcão. VENDEDOR MASCARADO: capuz preto, máscara branca de sorriso costurado e olhos vermelhos que piscam, respira e vira para você. FALAR: chegue a 6 m do vendedor; PC tecla E, celular botão FALAR, Quest botão A/X. MENU em tela cheia com os itens e preços e botão ZINCO de FECHAR (PC/celular: toque ou clique; Quest: painel na frente do rosto com laser, gatilho clica, B/Y também fecha). Com o menu aberto o jogador fica parado e não atira. COMPRA: usa o dinheiro do modo teste (res_vest_v1); COLETES compram de verdade (sobe o HP máximo); silenciador, bocas, pentes, mira e facas ficam só marcados como COMPRADOS (res_shop_v1), ainda sem ligar ao equipamento (as bandejas da bancada continuam livres no teste). Preços das peças (exceto coletes) são provisórios. O balcão/parede da loja bloqueia o jogador. Próximo: deixar a loja bonita e ligar as compras às peças.
  v93 (res_v93.html): NA HISTÓRIA AS ARMAS COMEÇAM SEM NENHUM ACESSÓRIO. Ao iniciar a história, tudo é removido (silenciador, bocas, pente alongado, mira de alcance, colete, faca nova volta à tática) e a história NÃO grava nem apaga os acessórios do modo teste (res_att_v1, res_vest_v1, res_knife_v1 só são salvos no modo teste). Os acessórios entram na história depois, pela loja (a fazer).
  v92 (res_v92.html): FACAS NOVAS (2 modelos, mais potentes). FACÃO: lâmina longa e larga escurecida, empunhadura com cordão laranja, alcance maior (ponta a 35 cm), dano x1.6 (corte e estocada). BOWIE: lâmina larga de ponta em clip com dorso serrilhado, guarda e pomo de latão, cabo de madeira, dano x2.2. A faca tática original continua (x1). Mesinha FACAS à ESQUERDA da bancada com as 2 facas que você não está usando (a que você troca volta para a mesa). Quest: pegue a faca da mesa com o grip e ela vira a SUA faca (vai para a bainha/bancada como a original). Celular: botão FACA: TATICA/FACAO/BOWIE perto da mesa troca. A escolha fica salva no aparelho (res_knife_v1). Próximas pedidas: laser na pistola e espingarda (tubo de carga maior e canos de 2/3 bocas).
  v91 (res_v91.html): PEÇA 5 = COLETES. O jogador COMPRA e o HP máximo sobe: LEVE +25 ($300, HP 125), MÉDIO +50 ($800, HP 150), PESADO +100 ($2000, HP 200). Ao comprar, a vida enche até o novo máximo; regeneração, morte/respawn, sangue na tela e gritos de dor passam a usar o HP máximo. Mesinha COLETES logo depois do fim da bancada (lado direito) com os 3 coletes (faixa branca/amarela/vermelha) e o preço no tampo. Quest: pegue o colete com o grip e leve ao PEITO (perto do corpo) para comprar e vestir; sem dinheiro o controle vibra e o colete não é vestido. Só compra nível acima do que já tem. Celular: botão COLETE perto da mesa compra o próximo nível. DINHEIRO: no modo história usa o dinheiro do jogo (S.money); no modo teste usa um saldo de $5000 salvo no aparelho (res_vest_v1, junto com o nível do colete). O colete fica salvo no aparelho. Na HISTÓRIA ainda sem onde comprar (aguardando decisão).
  v90 (res_v90.html): PEÇA 4 = MIRA DE ALCANCE (pistola, AK-47, sniper; não na espingarda). Pistola: ponto vermelho; AK: luneta curta; sniper: módulo balístico sobre a luneta. ALCANCE: o tiro vai 1,5x mais longe (pistola 90->135 m, AK 250->375, sniper 400->600). PERDA DE DANO À DISTÂNCIA (nova): sem a mira o dano cai a partir de 20 m (pistola, até 40% aos 90 m), 50 m (AK, até 40% aos 250 m) e 300 m (sniper, até 85% aos 400 m); com a mira a queda começa 1,6x mais longe, termina 1,5x mais longe e a perda total cai para 40%. Bandeja MIRA DE ALCANCE no fim da bancada (3 peças). Quest: pegue com o grip e leve ao topo da arma na mão; para tirar, grip na mira. Celular: botão ALCANCE liga/desliga perto da bancada. Salvo no aparelho (res_att_v1, campo r).
  v89 (res_v89.html): PEÇA 3 = PENTE ALONGADO V1/V2/V3 (pistola, AK-47, sniper; não na espingarda). MUDA A APARÊNCIA: pistola ganha extensão de base no cabo (curta/média/longa), AK ganha o carregador curvo mais comprido (V3 com sapata de latão), sniper ganha caixa de carregador saliente. CAPACIDADE: pistola 12 -> 17/22/30, AK 30 -> 40/50/75, sniper 5 -> 8/12/20 (recarregar e resetar enchem até a nova capacidade). Bandeja PENTES ALONGADOS na bancada (9 peças, faixa branca/amarela/vermelha = V1/V2/V3). Quest: pegue com o grip e leve até a boca do carregador da arma na mão; para tirar, grip na extensão. Ao tirar, a munição acima da capacidade normal se perde. Celular: botão PENTE troca NORMAL/V1/V2/V3 perto da bancada. Salvo no aparelho (res_att_v1, campo x).
  v88 (res_v88.html): PEÇA 2 = BOCAS V1/V2/V3 (pistola, AK-47, sniper; não na espingarda). Aparência quase igual, só muda a ponta do cano: V1 apagador de chama (6 fendas), V2 freio de boca (portas laterais/topo e anel de aço), V3 compensador pesado (maior, 3 níveis de portas, anéis e colar de latão). DANO: x1.15 / x1.30 / x1.50 (corpo, cabeça e membros). SOM: camada extra de estrondo (mais forte em V3) e o barulho chega mais longe para os inimigos (alcance x1.25 / x1.5 / x1.8). ENCAIXE ÚNICO: ou boca ou silenciador (se já tem um, o outro não encaixa e o controle vibra). Bandeja BOCAS na frente da bancada (9 peças, 3 por arma). Quest: mesmo gesto do silenciador (pegar com o grip, alinhar no cano; tirar com o grip da outra mão em cima). Celular: botão BOCA troca NENHUMA/V1/V2/V3 perto da bancada. Salvo no aparelho (res_att_v1). Na HISTÓRIA ainda sem onde conseguir (aguardando decisão).
   v87 (res_v87.html): PEÇA 1 = SILENCIADOR (pistola, AK-47 e sniper; NÃO encaixa na espingarda). (1) Na bancada há uma bandeja SILENCIADORES com 3 silenciadores (um por arma, tamanhos diferentes). No Quest: pegue com o grip e encaixe no cano da arma que está na sua mão (alinhado e perto da boca do cano). Para tirar: grip com a outra mão em cima do silenciador. Celular: perto da bancada, com a arma na mão, botão COLOCAR/TIRAR SILENCIADOR. (2) Com silenciador: SEM clarão, SOM ABAFADO próprio (pistola < AK < sniper) e os inimigos NÃO ouvem o tiro (não chama noiseAt). Inimigo atingido ainda reage ao dano. (3) Fica guardado no aparelho (res_att_v1); Resetar mantém o que está encaixado. (4) Estrutura pronta para as próximas peças (bocas v1-v3 entram no mesmo encaixe da boca do cano: ou boca ou silenciador). Na HISTÓRIA ainda não há onde conseguir o silenciador (aguardando decisão: loja/baú).
   v86 (res_v86.html): OBJETOS LEVES QUICAM. Estojos (pistola, espingarda, sniper, AK) quicam bastante e rolam, pente solto quica médio, pistola e faca soltas dão um quique curto. O quique efetivo é o produto da restituição dos dois corpos, por isso o chão/estáticos (massa 0) passaram de .12 para .7; corpos pesados (inimigos, caixotes, armas longas) continuam quase sem quicar. Só mudou restituição (sem nada novo na física), sem custo de FPS.
   v85 (res_v85.html): CARTUCHOS E BOLSOS MAIS BONITOS (simples, sem peso). (1) Pente solto da pistola: sapata de base, lábios, balas de latão/cobre aparecendo no topo, nervuras e janelinhas laterais. (2) Cartucho de espingarda ejetado: aro e espoleta de latão, crimpagem escura no topo e faixa clara. (3) Coldre: boca escura, tira de retenção com botão de pressão, costuras, aba de cinto, capa da ponta com rebite, couro com granulado. (4) Bolso do pente: aba com botões, costuras, base do pente aparecendo e faixa elástica. Tudo fundido em poucas malhas, sem luz/sombra/física nova.
   v84 (res_v84.html): ARMAS MAIS DETALHADAS E COM TEXTURA (sem peso no FPS, só visual). (1) TEXTURAS: metais com acabamento escovado + rugosidade variada (arranhões que mudam o reflexo) e desgaste na pistola/aço; empunhadura da pistola e polímeros/borrachas com granulado; madeira da espingarda e do AK com relevo de veios; carregador de baquelite com granulado. (2) PISTOLA: serrilhas frontais, janela de ejeção com extrator, miras com pontos brancos, anel da boca, martelo, trava do ferrolho, botão do pente, trilhos, placa da base e quadriculado nas laterais da empunhadura + gravações na tampa. (3) FACA: lâmina escovada com canais, carimbo, pinos na guarda, quebra-vidro no pomo, faixas vermelhas; bainha com costuras e rebites. (4) ESPINGARDA: porta-cartuchos lateral com 3 cartuchos, mira fantasma, braçadeira extra, carregador com ilhós, ferrolho à mostra, quadriculado no punho, parafusos da soleira e gravação. (5) SNIPER: trilho com ranhuras, estrias no cano, parassol e aro na luneta, ocular de borracha, marcas brancas na torre, parafusos dos anéis, pés de borracha e dobradiça do bipé, gravações. (6) AK-47: aberturas de ventilação no guarda-mão, rebites no receptor, trava do carregador, parafusos da soleira, porca da boca e carimbo no receptor. Todo detalhe novo é fundido em 1 malha por material (nenhuma luz, sombra ou física nova; texturas pequenas e compartilhadas).
   v83 (res_v83.html): BASE MAIOR E MAIS DETALHADA (sem peso no FPS). (1) Prédio com segundo andar (faixa de janelas), cornija, pilastras nos cantos, parapeito e telhado com caixa-d'água, ar-condicionado, antena com luz vermelha, parabólica e respiros. (2) ~30 janelas com vidro, moldura e peitoril (vistas por dentro e por fora), cela com janelas de grade. (3) Mais portas: portas duplas abertas na entrada com marquise, placa ENTRADA e soleira; portas fechadas nas divisórias, cela, saídas leste/oeste e porta vermelha de emergência com placa SAÍDA; batentes e folhas na abertura central. (4) Texturas: piso externo de lajes de concreto, piso interno quadriculado, paredes de concreto com rodapé/friso e manchas. (5) Interior: armários, balcão com monitores, recepção, mesa com mapa, 3 beliches, mesa com cadeiras, racks de servidor com LEDs, cama da cela, tapete, calhas e mais luminárias. (6) Torres com base de concreto pintada, escada, travessas, janelas na cabine, guarda-corpo e luz de sinalização. (7) Cerca com postes, mureta e arame; portão com pilares, guarita, cancela levantada e faixas amarelas no chão; caixotes, barris, sacos de areia, gerador e tanque. (8) Fora da cerca: galpão grande ao norte (HANGAR 02, portão de enrolar, janelas altas, respiros) e 2 alojamentos (leste e oeste). Tudo fundido em 3 malhas (caixas com cor por vértice, luzes sem iluminação, vidros) + 3 placas + 3 construções sólidas; nenhuma luz de ponto nova, sem sombras novas. Nada de inimigo, rota ou checkpoint mudou (guarita e galpões ficam fora das rotas).
   v82 (res_v82.html): CÉU NOVO NO MODO HISTÓRIA (sem peso no FPS). Antes o fundo era uma imagem estática 1024x512 com o 'chão' verde pintado embaixo do horizonte, e o mar era cortado em 700 m antes de a névoa escondê-lo, então dava pra ver a emenda onde o céu 'nasce'. Agora: (1) domo procedural de 1 malha (24x12) + 1 shader: degradê névoa no horizonte -> azul médio -> azul profundo no zênite, sol com brilho e disco (mesma direção da luz do sol, então bate com as sombras), nuvens projetadas num plano alto (grandes em cima, achatando e sumindo no horizonte), com lado iluminado/lado de baixo e borda prateada perto do sol, cirros finos e vento levando as nuvens devagar. (2) O horizonte termina exatamente na cor da névoa e passa pelo mesmo tonemapping do jogo, sem emenda. (3) camera.far do modo história 700 -> 1600 (com a névoa o mar some inteiro antes do corte; a precisão de profundidade praticamente não muda). (4) DESEMPENHO: 1 textura de ruído 256x256 gerada uma vez no início, ~5 leituras de textura por pixel de céu, sem pow() caro, e o domo é desenhado depois dos objetos opacos, então só calcula onde o céu aparece. Sem luz nova e sem mexer nos reflexos/IBL (scene.environment continua o antigo, com o sol na mesma direção), então a iluminação que você acertou fica igual. O MODO TESTE continua com o céu antigo. Ajustes de cor: S.skyOn() (uM = azul médio, uZ = zênite; a cor do horizonte é a da névoa).
   v81 (res_v81.html): ROSTOS MENOS COMPRIDOS + BOCA DA EMMY. (1) Rosto encurtado: tudo abaixo da linha dos olhos (nariz, boca, queixo) foi comprimido a 84% na vertical (malha do rosto, cabelo e grade de sangue juntos), então a distância olho-boca e o queixo ficam bem mais curtos; os olhos e o topo da cabeça não mudam (tiara/brincos da Emmy ficam no lugar). (2) Mandíbula/queixo menos afunilados (afunilamento de 20% para 11%): a cabeça deixa de parecer um ovo comprido e o queixo fica mais cheio. A textura segue a malha, então rugas, barba e boca acompanham. (3) BICO DE PATO DA EMMY (e de todas as mulheres): os lábios saltavam para a frente (relevo do lábio feminino era 1,5x o masculino) e eram estreitos, formando um bico. Agora o relevo dos lábios foi reduzido (cerca de 40-50%) e alargado, e a bochecha afundada ao lado da boca foi suavizada; os lábios das variantes de rosto também foram moderados.
   v80 (res_v80.html): ROSTOS VARIADOS + EXPRESSÕES NOS INIMIGOS (sem peso no FPS). (1) 6 rostos masculinos e 3 femininos diferentes, escolhidos em sequência (vizinhos não repetem): relevo próprio (nariz, sobrancelha, maçãs, lábios, queixo, mandíbula) + textura própria (sobrancelha cheia, barba rala/cheia, bigode e cavanhaque, rugas, olheiras, cicatriz, sardas, pinta) + cor dos olhos. Geometria e textura são compartilhadas entre inimigos que usam a mesma variante; a Emmy mantém o rosto dela. (2) EXPRESSÕES por morph targets (2 no rosto, 2 nas pálpebras): NEUTRO, RAIVA (sobrancelhas descem e se juntam, pálpebra de cima desce mais no canto de dentro, narina abre, cantos da boca descem, lábios apertados) e DOR (sobrancelha interna sobe, bochecha sobe e espreme o olho, nariz franze, boca em esgar com queixo caindo; também lê como medo em quem foge). (3) GATILHOS: desconfiado = raiva leve, alerta = raiva forte (bruto 100%), levar golpe/soco/tiro = pico de dor que some em ~1 s, vida abaixo de 40% = dor permanente, morrendo = dor que relaxa até ficar mole, fugindo = medo; Emmy tem raiva ao atirar e dor ao ser ferida. (4) TRANSIÇÃO GRADUAL: o valor mostrado persegue o alvo por suavização exponencial (raiva sobe em ~0,3 s e desce em ~0,7 s; dor sobe em ~0,1 s e desce em ~0,5 s) com curva suave, então nunca troca de uma vez. (5) DESEMPENHO: nenhuma malha, textura ou material novo por inimigo; custo por quadro = alguns números por inimigo, só atualiza quando muda >0,3%, pula inimigo fora da tela (culling) e cadáver já relaxado; o sangue da cabeça continua igual (rosto herda a textura da variante).
   v79 (res_v79.html): REBALANCEIO DO RECUO DAS ARMAS NO INIMIGO (realismo). A pistola empurrava e arremessava o inimigo quase como a espingarda (força 2.2 corpo/3.4 cabeça + empurrão 36 + tombo 'arremessado' em tiro na cabeça). Agora: PISTOLA força .5 corpo/.6 cabeça, empurrão 12 (~1 m/s: o inimigo estremece e cambaleia; morto por tiro cai no lugar, sem voar). AK-47 .9/1.2, empurrão 35 (balas em rajada não empilham arremesso). SNIPER 1.8/2.2, empurrão 75 (continua derrubando para trás). ESPINGARDA inalterada (de perto continua arremessando). Ordem de potência: pistola < AK < sniper < espingarda.
   v75 (res_v75.html): DESEMPENHO COM HORDA (Quest 2), sem mudar o visual. (1) CULLING MANUAL DE INIMIGOS: os corpos eram desenhados mesmo fora da tela (frustumCulled=false por causa da pele animada). Agora, quem está fora do campo de visão (com folga de 2,2 m), a mais de 4 m, sem projetar sombra e sem estar na mão, fica oculto; desligado com luneta ou dentro de carro. Quem já projeta sombra (perto) nunca some, então as sombras não mudam. (2) ANIMAÇÃO POR CADÊNCIA: inimigos fora da tela e cadáveres parados há mais de 6 s animam em quadros alternados (como os distantes já faziam). (3) Sem alocação de array por inimigo por quadro na animação. (4) Ocultar cadáveres distantes passou a usar o.hid (não briga com o culling).
   v74 (res_v74.html): CORREÇÕES de subida/descida. (1) CORRIDA POR BALANÇO NA DESCIDA: o jogo detectava "agachar" pela altura da cabeça no MUNDO; ao descer o morro o chão baixava >30 cm e ele achava que você estava agachado (corrida -70%, velocidade -45%, passos silenciosos). Agora no VR a altura é medida da cabeça em relação ao chão sob você (posição local no rig), então subir/descer não agacha mais. (2) ARMA ATRAVESSANDO O CHÃO: a arma solta herdava a velocidade da mão + a do corpo descendo a ladeira e, sendo fina, atravessava o terreno (tunelamento). Agora as armas e carregadores soltos usam colisão contínua (CCD) e há uma rede de segurança: se um deles ficar abaixo do terreno, volta para cima do chão, parado. (3) Pedaços de carne e gotas de sangue pousavam no plano y=0 e sumiam dentro dos morros; agora pousam na altura real do terreno.
   v73 (res_v73.html): GORE MAIS INTENSO E REALISTA (esguicho/respingos iguais). (1) Ferida aberta mais frequente: chance de rasgar a pele ~+45% (pistola ~75%, rifle/espingarda quase sempre) e corte 70% (antes 40%); mais pedaços de carne/osso/tripa (limite 140). (2) Ferida por dentro: hematoma roxo-avermelhado em volta, mais fibras de músculo, coágulos escuros na cavidade, mancha de sangue maior. (3) Ferida aberta continua vertendo e escorrendo pela pele por ~90 s (antes só o escorrimento comum). (4) Pedaços ficam mais molhados/brilhantes, soltam gotas enquanto voam e deixam mancha + rastro arrastado no chão (até 420 manchas). (5) Poças sob corpos crescem devagar (~25 s), com formato irregular e escurecem aos poucos (sangue coagulando). (6) Decepar: toco com 4 fios hemorrágicos (antes 2) e carne/osso voando no corte.
   v72 (res_v72.html): MAIS ESCORRIMENTO DE SANGUE NA PELE (esguicho/respingos iguais). (1) Corpo e rosto: cada ferida solta mais fios ao mesmo tempo e com menos pausa (até 9 por ferida no corpo, 7 no rosto), tiro abre com 5 fios (antes 3), corte/soco forte com 3; fios ficam ~30% mais grossos, carregam mais volume e descem bem mais longe antes de empacar; a ferida continua sangrando ~50% mais tempo. (2) Por onde o fio passa a própria pele fica avermelhada (cor dos vértices), então o rastro não some. (3) Tudo continua colado na pele (malha skinada no corpo, textura pintada no rosto, mesma distância da pele): nada paira. Gotas que caem seguem iguais.
   v71 (res_v71.html): DESEMPENHO (Quest 2), sem mudar o visual. (1) Peças fixas do cenário (pisos, tetos, muros decorativos que não são portas nem paredes de colisão) têm a matriz congelada: o Three.js deixa de recalcular a posição delas todo quadro. (2) FOVEAÇÃO ADAPTATIVA mais rápida: reage em ~0,75 s (antes 1,5 s) e com média mais sensível, então o jogo sobe a foveação (só afeta a borda da lente) logo que o quadro passa do orçamento e volta ao normal quando alivia. (3) Física com passo fixo de 1/72 s no VR (1 passo por quadro, sem quadros com 0 ou 2 passos) e no máximo 3 passos em quadro lento (evita espiral de lentidão). Resolução central, sombras, luzes, texturas e modelos iguais.
   v68 (res_v68.html): PARTE 7 (vozes). (1) Pasta vozes/ gerada na Arena IA e integrada: 53 mp3 (Pen 5, Emmy 18, inimigos 28; c1_inimigo_014 "Argh... porra..." foi bloqueada pelo filtro e FICA PENDENTE, o jogo ignora arquivo ausente). (2) Legendas da Emmy atualizadas para o texto realmente falado (005,006,007,009,010,011,012,015,017; "inútil" saiu). (3) VOZES DOS INIMIGOS (S.vox em S.tick, SEM legenda na tela): desconfiado, procurando, alerta, corpo achado, dor, morte, cobertura dos atiradores, brutos, civil fugindo, horda e ilha; volume cai com a distância; recarga global 1,3 s e por inimigo. Cada inimigo tem tipo de voz fixo A/B/E (C=bruto, D=fugitivo). (4) Bíblia: LISTA DE FALAS com os 29 códigos de inimigo e textos finais.
  v69 (res_v69.html): CORREÇÕES do Capítulo 1. (1) Cartucho do bolso agora SEMPRE entra: se a pistola ainda tem pente dentro (cheio, com sobra ou vazio), o antigo é ejetado e cai com as balas que restavam, e o novo encaixa; encaixe também mais folgado. (2) Pistola pega com qualquer mão, mesmo com faca ou objeto na outra mão (o layout espelha e leva faca/objeto junto). (3) Andar durante o corpo a corpo: o hit-stop não congela mais o movimento. (4) Esconderijos novos: ~44 peças no pasto (muros, containers, pilhas de caixas, fardos) e 6 na base, fora de rotas e munição. (5) Corrida: balançar de braços bem mais sensível e vale com uma mão ocupada (pistola). (7) Gramado mais verde, armas mais pretas, sangue mais vermelho (e que escurece menos). (8) Emmy atira de mais longe (24 m), mira mais rápido e mais folgado; inimigos (bruto/atirador em alerta) passam a ir atrás dela quando ela está bem mais perto que você. (9) Helicóptero: cabine maior com piso, bancos, parede de trás e teto (frente e lados abertos), jogador e Emmy no nível do piso. (10) FPS com horda: sombras só dos inimigos perto, animação pela metade e sem cabelo nos longe, sombras do cenário a cada 3 quadros e foveação máxima quando há 7+ inimigos por perto. (11) SALVAMENTO: autosave no navegador (localStorage 'res_save_v1') a cada checkpoint, a cada 15 s e ao sair da página; no fim do capítulo salva e baixa res_save.json sozinho; botão 'salvar JSON' na tela (fora do VR); no menu, CONTINUAR (do navegador) e CARREGAR JSON (arquivo). Guarda ponto, eventos, Emmy resgatada, dinheiro, pistola/faca e munição; inimigos mortos e caixas de munição voltam. (6) Cores: exposição, luz ambiente e sol menores, saturação e contraste maiores, névoa e reflexo do céu mais azuis.
  v67 (res_v67.html): PARTE 6 (caça a bugs). (1) BUG GRAVE: no módulo STORY a constante ST=4 (passo do terreno) escondia o objeto global ST (furtivo): quebrava holofotes (S.lit virava NaN, nunca detectavam), a IA da Emmy ao atirar e o bloco de inimigos que reagem à Emmy (TypeError em S.tick). Renomeada para TS. (2) debug desligado por padrão (só liga com #debug no endereço; o botão 'próx. ponto' e as teclas 1..6 também só nesse modo). (3) Respawn no helicóptero não reabre a IA da Emmy (S.es). (4) Som do rotor some no cartão final. (5) Inimigos mortos há mais de 30 s e a mais de 75 m ficam ocultos (desempenho). (6) +2 caixas de munição perto da colina. (7) Rótulo do menu atualizado.
   v66 (res_v66.html): PARTE 5 CONCLUÍDA (+20%). (1) EMMY A BORDO: ela agora aparece dentro do helicóptero (lado direito da cabine, presa ao helicóptero a cada quadro) em vez de sumir. (2) CENA FINAL: depois da 4ª onda o helicóptero segue para o oeste sobre o mar; a Emmy fala (c1_emmy_013 já existia e agora c1_emmy_014..018) revelando coisas sobre a facção, aliviada mas sem agradecer, e a Pen fecha com c1_pen_005. (3) FIM: a tela escurece e aparece o cartão 'FIM DO CAPÍTULO 1 · Emmy resgatada' (recarregar a página para jogar de novo). (4) Removido o aviso provisório 'Fim do trecho jogável atual'. SUPOSIÇÃO: o conteúdo das revelações da Emmy (operação grande e treinada, ilha é só uma de várias bases com mapas, alguém de fora bancando e por isso a prenderam viva) foi inventado por mim, a bíblia só diz 'algumas coisas sobre a facção'; confirmar ou trocar.
  v65 (res_v65.html): PARTE 5 (~80%, +30%). TIROTEIO SOBRE A ILHA. (1) Ao chegar na ilha o helicóptero passa a circular em volta dela (raio 88 m, altura 26 m, ~21 m/s, inclinado na curva) com você na cabine; munição reabastecida (+48) e +24 a cada onda. (2) 4 ONDAS: 1) 4 atiradores a pé na estrada em anel; 2) 2 atiradores + 2 carros (gol, civic) que aceleram atrás de você e emparelham; 3) 4 a pé + 2 carros (mustang, lambo); 4) 5 a pé. Cada onda dura no máximo 45 s (se sobrar gente eles recuam). (3) ACERTAR: tiros da pistola acertam alvos por esfera (homem 70 de vida = 2 tiros, carro 130 = 4 tiros), com sangue/faíscas; carro destruído vira bola de fogo escura e para; homem cai. (4) ELES ATIRAM: inimigos em alcance (até 90 m) atiram em você com rastro (1 tiro a cada ~0,2 s no máximo no conjunto, chance 7% a 26% conforme a distância, dano 4-7), usando o sangue na tela da v62. (5) Morrer durante o tiroteio recomeça o tiroteio no helicóptero (não volta ao topo). (6) Falas novas da Emmy c1_emmy_011 (carros), 012 (você com pouca vida), 013 (fim). (7) Ao limpar a 4ª onda o helicóptero se afasta para o oeste e aparece 'Fim do trecho jogável atual'. Falta da Parte 5: cena final com as revelações da Emmy (a Emmy ainda não aparece a bordo) e acabamento.
  v64 (res_v64.html): PARTE 5 (~50%, +30%). HELICÓPTERO E CORDA. (1) O helicóptero some do topo no começo; depois da ligação da Pen no topo (ev 'topo', que agora é checkpoint 'Topo') ele vem voando do mar com som de rotor, desacelera e fica parado a 6,5 m do chão. (2) Uma corda comprida (7,3 m, com nós e laço) desce da porta direita. (3) VR: segure com o GRIP perto da corda e puxe as mãos para baixo para subir (mão sobre mão; se soltar com as duas mãos você cai e leva dano se a queda for alta). No celular/tela: chegue perto da corda ~1 s que sobe sozinho. (4) Ao chegar na porta: tela escurece, você aparece dentro do helicóptero (Emmy some, já está a bordo) e ele decola e voa para a ilha, parando sobre ela. Esse trecho final é provisório: aparece 'Fim do trecho jogável atual'. Falta da Parte 5: tiroteio em alta velocidade sobre a ilha (carros e inimigos), cena final com as revelações da Emmy, e a Emmy visível subindo/dentro do helicóptero.
  v63 (res_v63.html): PARTE 5 (~20%). (1) FUGA COM HORDAS: ao sair da base com a Emmy (evento 'saida') uma horda de grandes (fuga1) aparece no pasto ~3 s depois e vem direto em vocês; ao chegar no novo checkpoint 'Fuga' (25,-295) vem a segunda (fuga2); a da colina continua no evento 'colina'. (2) Aviso 'Horda eliminada' quando um grupo inteiro morre (S.hg). (3) Mais 2 caixas de munição na subida da colina. (4) LIGAÇÃO DA PEN NO TOPO: com a Emmy junto, o evento 'topo' dispara a fala c1_pen_004 avisando do helicóptero (o helicóptero em si e a corda comprida ainda NÃO foram feitos). Falta da Parte 5: chegada do helicóptero, corda e subida em VR, tiroteio sobre a ilha, cena final.
  v62 (res_v62.html): SANGUE NA TELA (modo história). Quando o jogador está machucado a tela ganha uma borda vermelha escura (vinheta) e respingos/escorridos de sangue nas bordas; quanto menos vida, mais forte (começa abaixo de ~70 de vida). Cada ferida dá um clarão vermelho que some em ~1,5 s. Abaixo de 40 de vida pulsa como batimento (mais rápido abaixo de 20). Some sozinho conforme a vida regenera e some durante a tela de morte (que tem o vermelho dela). Funciona no celular e no VR (planos presos à câmera, S.bl).
  v61 (res_v61.html): PARTE 4 CONCLUÍDA (+25%). (1) INIMIGOS ATIRAM NA EMMY: atiradores em alerta, com linha de visão e a até 26 m dela, atiram nela quando ela está mais perto que você (ou você está longe); brutos batem nela de perto. Ela agora tem vida própria (S.eh, 100): leva 6-10 por tiro e 9 por soco, regenera depois de ~8 s sem ser ferida. Se ela cai a 0, aparece 'Emmy caiu' e roda a tela de morte (a missão é salvá-la), voltando ao checkpoint com ela inteira. (2) Gritos novos c1_emmy_009 (ela é atingida) e c1_emmy_010 (vida baixa), com recarga de 10 s. (3) Aviso na tela 'Emmy ferida' quando a vida dela fica abaixo de 35. (4) Respawn restaura a vida dela. Falta (outras partes): balanceamento e testes (Parte 6), fuga e hordas (Parte 5).
  v60 (res_v60.html): PARTE 4 (~75%, +25%). (1) ALARME DA BASE: quando um inimigo da base entra em alerta, os outros da base a até 34 m também (vão até onde você estava) e os holofotes varrem 1,8x mais rápido; acalma depois de ~25 s sem ninguém em alerta. (2) INIMIGOS REAGEM À EMMY: calmos que veem a Emmy a menos de 11 m (cone de visão, sem parede) enchem a barra de detecção devagar (0,6/s no máximo) e vão até onde ela está; ela agora é um risco para o furtivo. (3) EMMY ATRAVESSA A BASE: caminho por waypoints pela porta do prédio (80,-350) e pela abertura da divisória (80,-370), então não trava nas paredes (S.via). (4) Grito novo c1_emmy_008 quando o jogador faz um abate furtivo perto dela. (5) Novo checkpoint "Saída da base" em (80,-318), só vale depois de a Emmy ser solta (evento com cond). Falta: inimigos poderem atirar e ferir a Emmy, balanceamento e testes (Parte 6).
   v59 (res_v59.html): PARTE 4 (~50%, +20%). EMMY COMPANHEIRA: depois da cena da pistola ela passa a seguir o jogador (fica ~3 m atrás e ao lado, acelera se ficar longe, se trava ou fica a mais de 30 m ou o jogador volta de checkpoint ela é teleportada para perto) e ATIRA nos inimigos que já estão em alerta (alcance 30 m, só com linha de visão, ~1 tiro por segundo, 65% de acerto, 35 de dano, com rastro, som e reação do corpo do inimigo). Ela não ataca quem ainda está calmo, para não estragar o furtivo. Gritos novos c1_emmy_005..007 (alerta e morte, com recarga de 10 s). Emmy continua invulnerável e os inimigos ainda só miram no jogador. Falta: afinar infiltração e abates na base e fechar a saída da base.
   v58 (res_v58.html): PARTE 4 (~30%, +20%). (1) HOLOFOTES: 4 torres da base varrem o pátio com feixe de luz (cone aditivo); se o feixe pega o jogador por ~1,2 s (agachado demora mais) os inimigos a até 40 m ficam em alerta indo até onde você estava; tem recarga de 8 s. (2) CENA DA EMMY: ao chegar na porta da cela ela abre, Emmy sai andando até uma mesinha, pega a pistola dela (arma aparece na mão e o braço sobe), manda o jogador ir na frente e sai para perto da porta olhando para ele. 4 falas novas c1_emmy_001..004 (na LISTA DE FALAS). Ela não agradece. Falta: Emmy seguir o jogador e atirar, afinar infiltração e abates.
   v57 (res_v57.html): (1) TELA DE MORTE estilo GTA no modo história: ao morrer, tela fica vermelha, aparece "SE FUDEU" grande (entra com zoom), som grave descendente, o jogador fica parado ~3 s, escurece e volta ao checkpoint (S.die/S.doRespawn; plHurt continua chamando resetAll → S.respawn). (2) PARTE 4 (~10%): os 6 inimigos da base ganharam rotas com pausas (portão, lateral oeste, sala da frente, sala dos fundos) e novo checkpoint "Prédio" na sala da frente. Nada de falas novas (a bíblia ainda não define). Falta o resto da Parte 4.
   v56 (res_v56.html): PARTE 3 CONCLUÍDA (Ato 1 jogável de ponta a ponta). (1) ABATE FURTIVO afinado no acampamento: os 3 inimigos nascem de costas para quem sobe, andam em rotas curtas e PARAM olhando para longe do caminho (janelas para atacar por trás), notam 25% mais devagar (o.dm=.75) e o acampamento ganhou cobertura (2 barracas, 3 caixas de madeira, fogueira). (2) FACA: o jogador começa sem equipamento, então há UMA FACA num toco ao lado do caminho, antes do acampamento (SUPOSIÇÃO do Claude, a confirmar com o usuário); pega-se com o GRIP e vai para a bainha como no modo teste. (3) PISTOLA FÍSICA: a pistola fica deitada em cima da caixa verde do acampamento; no Quest pega-se com o GRIP (sem pegar automático); os 20 tiros = 12 no pente + 8 no bolso (o bolso começa vazio). (4) SUBIDA: andar fica mais lento em ladeira (S.cfg.walk varia com a inclinação). (5) PATRULHAS DO PASTO: 2 duplas andando juntas em rotas (S.route), além dos 3 do pasto. (6) ECONOMIA DE MUNIÇÃO: bolso limitado a 6 pentes (S.addAmmo completa pentes pela metade e respeita o limite); caixas dão +12, munição solta no chão do pasto +6, inimigos dropam 4 a 8; caixa/munição cheia fica no lugar para voltar depois. (7) Morrer devolve faca (bainha) e pistola (coldre) e garante ao menos 8 tiros no bolso. (8) Fogueira com chama tremendo (sem luz extra, por desempenho).
   v55 (res_v55.html): PARTE 3 (~10%, adiantada). (1) Primeira fala da Pen no ponto "pen": 3 falas fiéis ao que está definido na bíblia (c1_pen_001..003), no lugar da fala de teste. (2) Chiado de rádio sintetizado (WebAudio, sem arquivo) quando a Pen começa a falar. (3) Abertura: Davi acorda piscando (a tela clareia, pisca e abre), sem texto. Nada mais da Parte 3 foi feito: falta abate furtivo dos 3 do acampamento afinado, patrulhas/economia de munição do pasto e demais ajustes.
   v54 (res_v54.html): VISUAL DA EMMY (sem mudar jogabilidade). Cabelo loiro com raiz mais escura e pontas claras (balayage), mechas platinadas e mais mechas na frente; olhos azuis; rosto com sardas, pintinha, blush, batom rosado e sobrancelhas loiras (textura própria só dela); top cropped branco com friso rosa, mini saia plissada rosa com barra branca, pernas e barriga de fora, tênis branco; brincos de argola com pérola, tiara de cetim rosa com laço, gargantilha com pingente, corrente dourada, xuxinha no pulso esquerdo e pulseiras douradas no direito. Novos parâmetros do look (L.ex, L.eye, L.hc, L.tip, L.hl, L.fr, L.crop, L.trimC, L.acc) reutilizáveis em outros personagens.
   v53 (res_v53.html): PARTE 2 CONCLUÍDA. (1) EMMY com modelo real (corpo/rosto/cabelo longo loiro com física, como as outras mulheres), parada na cela, aliada (o.ally: fora do sistema de detecção; vida enorme). (2) INIMIGOS GRANDES de verdade: a cápsula física agora acompanha a escala (L.s>.97), a horda da colina usa escala 1,08/1,14 e 150 de vida. (3) PATRULHAS: inimigos calmos andam em rota própria (o.pat), pasto com raio maior; alerta/procura/retorno continuam como antes. (4) Helicóptero do topo com corda amarrada na porta (provisória, curta, Parte 5 estende) e colisão. (5) Carros na estrada da ilha (RESCAR.mk). (6) Pontos de horda para a Parte 5 (S.hordePts). (7) Piso da base mais rente ao terreno (pés não afundam tanto).
   v52 (res_v52.html): PARTE 2 (~80%): horda de 5 inimigos grandes (forte/gordo) já alertas ao chegar na colina final (STORY.horde).
   v51 (res_v51.html): PARTE 2 (~65%): modelo provisório da Emmy na cela (porta abre ao chegar perto) e helicóptero parado no topo da colina.
   v50 (res_v50.html): PARTE 2 (~45%): caixas de munição no pasto e na base (+12), inimigos dropam grana e munição ao morrer (STORY.money), mais 3 inimigos dentro da base.
   v49 (res_v49.html): PARTE 2 (~25%): pistola + 20 munições no acampamento (caixa verde, pega ao chegar perto), 3 inimigos no pasto e 3 na base.
   v48 (res_v48.html): PARTE 2 começada (~10%): 3 inimigos posicionados no acampamento do modo história.
   v47 (res_v47.html): CORREÇÃO do balançar de braços no Quest (só corria em um ângulo estranho). Antes cada mão era medida no eixo da frente da CABEÇA; agora conta qualquer par de mãos indo em sentidos opostos no plano horizontal, em qualquer direção (só descarta movimento puramente lateral).
   v46 (res_v46.html): MODO HISTÓRIA, PARTE 1 (estrutura e mapa). JOGAR agora abre o capítulo 1 (o MODO TESTE continua igual). Novo: mapa do cap. 1 (morro com subida, mar, pasto, base iluminada com cela da Emmy, colina final, ilha), terreno com física, eventos/checkpoints, legenda + quadradinho azul da Pen, fila de falas com voz opcional, jogador SEM equipamento. Veja NOTAS TÉCNICAS DA PARTE 1 na bíblia.
   v45 (res_v45.html): SÓ DOCUMENTAÇÃO, nenhuma mudança de jogabilidade. Adicionada a BÍBLIA DO MODO HISTÓRIA (princípios, história do capítulo 1, as 7 partes, status e lista de falas). Título, meta e RES_VERSION atualizados.
   v44b: CORREÇÕES após teste no Quest. (a) ESPINGARDA TRAVAVA o jogo ao soltar/segurar com duas mãos: o release() não conhecia os tipos 'shg' e 'fgrp' da espingarda (gerava erro e o loop de animação do VR morria); corrigido, e o loop agora é protegido por try/catch (um erro não congela mais tudo). (b) INIMIGOS só mexiam a cabeça: o material do corpo (SkinnedMesh) estava sem skinning:true (three r128); corpo, braços e pernas voltam a animar. (c) PENTE: encaixe na pistola mais tolerante (raio maior e matriz da arma atualizada). (d) FACA em QUALQUER mão (a que pegar); mão vazia some quando a faca está na direita. (e) ARMAS COM QUALQUER MÃO: se você aperta o grip e não pega nada com as duas mãos livres, o layout ESPELHA (coldre, bolso, bainha, armas das costas e mão principal trocam de lado) e tenta de novo. (f) CORES mais fortes: exposição menor, luz ambiente menor, reflexo do céu mais escuro/azulado, saturação +55% e leve contraste no shader final.
   v44 (res_v44.html): (1) BALANÇAR DE BRAÇOS no VR corrigido: velocidade das mãos medida em espaço local do rig (andar com o analógico não alimenta mais o sprint), com dt sem hit-stop, só movimento ALTERNADO frente/trás, ignorando mão ocupada (arma/objeto/faca). (2) FACA no VR: ESTOCADA com resistência. A ponta entra com dificuldade (empurrão lento emperra, rápido penetra; quanto mais fundo, mais duro), o cabo/guarda NÃO entra (a lâmina para no limite e o controle vibra), puxar para trás tira a faca. Com a faca enfiada ou só raspando a superfície dá pra RASGAR: mover a mão de lado abre o corte (superficial = corte leve; fundo = rasgo pesado, pode decepar membro e matar). Arrancar de lado com força rasga e solta a faca. Golpes de varrer (talho) continuam como antes.
   v43 (res_v43.html): DESEMPENHO (Quest 2), sem mudar o visual. (1) LUZES: eram 4 luzes pontuais (pistola, espingarda, sniper, AK) ligadas o tempo todo, mesmo apagadas, e cada pixel de cada material calculava as 4. Agora existe UMA luz de clarão compartilhada que se move para o cano da arma que atirou (mesma cor, alcance e intensidade). (2) SOMBRAS: no VR o mapa de sombras é redesenhado em quadros alternados (metade do custo de sombra; a diferença de 1 quadro não é perceptível). No celular continua todo quadro. (3) FOVEAÇÃO do Quest em 0,5 (só reduz a resolução bem na borda da lente; constante XR_FOVEATION no topo do JS, 0 desliga). Não altera cores, luzes do ambiente, sombras, resolução central nem modelos.
   v42 (res_v42.html): (1) MÃO DIREITA no Quest 2: garantia reforçada. Todo quadro em VR o jogo confere se a mão direita está presa ao controle direito (se o Quest trocou/reconectou os controles, ela é religada sozinha; se o controle direito ainda não foi identificado, usa o segundo controle), força a visibilidade do controle, da mão e de todas as malhas (sem corte de câmera) e deixa a pele da mão mais clara/emissiva para não sumir em áreas escuras. (2) CORES DE DIA: céu azul com nuvens, sol branco-quente alto, luz de preenchimento forte (sem sombras pretas), neblina clara e leve, chão/paredes/caixotes/barris/coberturas mais claros e saturados, exposição e saturação maiores.
   v36 (res_v36.html): CORREÇÃO VR: a mão direita (e a arma/objetos presos nela) sumia no Quest. Causa: fora do VR o jogo esconde o grupo da mão direita quando a arma está na bancada e, ao entrar no VR (ou reentrar), nada o tornava visível de novo. Agora no VR a mão direita fica sempre visível (loop, place() e handsBack()).
   v35 (res_v35.html): HELICÓPTERO (só o exterior, parado, sem entrar): fuselagem, cabine de vidro, cauda, esquis, rotor principal e de cauda girando, sobre um heliponto à direita e à frente (x 11, z -13). Sem colisão.
   v34 (res_v34.html): CORDA DE ESCALAR (só Quest). Pórtico de aço com colchão perto do início (à esquerda, atrás). Corda de 6 m com física Verlet (balança, tem inércia, empurrada pelas mãos, nós a cada ~1 m). Grip perto da corda = agarra; puxar a mão pra baixo sobe o corpo, alternando as mãos escala de verdade; soltar o grip solta (cai com gravidade, mantém o impulso do balanço, vibração no impacto). Segurado, o analógico de andar fica desligado.

 PREFERÊNCIAS DO USUÁRIO (valem para toda atualização):
   - Sem poluição na tela: evitar HUD, textos, botões e avisos desnecessários.
   - Jogo o mais MANUAL e REALISTA possível: nada de atalhos automáticos; cada ação (sacar, mirar, ejetar/inserir pente, puxar ferrolho, segurar) é feita fisicamente com as mãos.
 Mapeamento Quest (xr-standard): buttons[0]=gatilho, buttons[1]=GRIP, buttons[4]=A/X, buttons[5]=B/Y.

 ===== MODO HISTÓRIA: BÍBLIA DO PROJETO (instrução permanente para o Claude, vale em TODAS as conversas) =====
 LEIA ESTE BLOCO INTEIRO ANTES DE MEXER NO MODO HISTÓRIA. O usuário constrói o modo história em várias conversas, uma parte por vez. Nada se perde: tudo que importa está aqui.

 --- PRINCÍPIOS FIXOS ---
 P1. VOZES: o usuário gera as vozes na Arena IA. Eu entrego um prompt grande com todas as vozes (personagem, tom de voz, texto da fala e NOME EXATO do arquivo). O usuário gera e coloca tudo numa pasta. No index eu só deixo o código pronto para tocar cada arquivo na hora certa (gatilho, legenda, volume, fila para não sobrepor falas, e a falha de arquivo ausente NÃO pode travar o jogo).
     Convenção de nomes (manter sempre): pasta "vozes/", arquivo "c1_<personagem>_<NNN>.mp3" (c1 = capítulo 1; ex.: c1_pen_001.mp3, c1_emmy_014.mp3, c1_inimigo_007.mp3). Nunca renomear arquivo já combinado. Cada parte registra suas falas numa LISTA DE FALAS no fim deste bloco (id, personagem, tom, texto, gatilho), para a Parte 7 montar o prompt final sem esquecer nada.
 P2. LINGUAJAR: jogo ADULTO. Muito palavrão, personagens com personalidades fortes e bem diferentes entre si. O JOGADOR (Davi) NUNCA TEM FALAS: ele é mudo, só os outros falam com ele ou sobre ele.
 P3. VÁRIAS CONVERSAS: é impossível fazer um capítulo inteiro numa conversa só. O usuário continua cada parte em uma conversa nova, enviando o último res_vN.html. Ao terminar uma parte: salvar como novo arquivo res_v(N+1).html (regras de versionamento acima), atualizar o STATUS DAS PARTES abaixo e a LISTA DE FALAS. Nunca pular parte nem refazer parte já concluída sem o usuário pedir.
 P4. Reaproveitar os sistemas que o jogo já tem (furtivo e detecção, abate por trás com faca, tipos de inimigos, armas, VR no Quest + celular, tela limpa sem botões). O modo história se apoia neles, não reescreve. Desempenho no Quest 2 continua sendo prioridade.
 P5. O que o usuário não definiu, eu não invento na história. Se faltar decisão importante, pergunto ou proponho e espero aprovação.

 DAVI (o jogador): conhecido como "Ceifador". Contratado pelo governo americano para missões muito difíceis. Sem falas. No começo do capítulo 1 está sem memória (pulou do helicóptero) e sem nenhum equipamento.

 INIMIGOS: membros da facção que Emmy investigava. Vários tons de voz para gritos, alerta, procura, reação a corpo encontrado, morte.

 --- HISTÓRIA DO CAPÍTULO 1 (resumo fiel do que o usuário definiu) ---
 1. ABERTURA: Davi acorda a céu aberto, de dia, com sol, vista para o mar. Está sem equipamento nenhum. Precisa subir um morro.
 2. ACAMPAMENTO: subindo o morro e andando um pouco, encontra 3 inimigos andando. O jogo deve dar a OPORTUNIDADE DO ABATE FURTIVO. No acampamento deles há uma pistola e 20 munições.
 3. PEN: o jogador segue reto pelo caminho até a escuta voltar a funcionar. Pen aparece no quadradinho azul, pergunta se o Ceifador está bem e diz que ele pulou do helicóptero e deve ter perdido a memória. A missão: salvar a Emmy, que foi investigar a facção e parou de dar notícia.
 4. PASTO: mais combates, grupos de inimigos andando no pasto verde. Munição de pistola espalhada em caixas e pelo chão. Inimigos dão grana e munição de pistola ao morrer.
 5. BASE: o jogador entra numa base ILUMINADA (não é sombria nem escura). Vai eliminando inimigos andando pela base até achar a Emmy, trancada atrás de uma porta.
 6. EMMY SOLTA: criar as falas dela. Ela pega uma pistola (animação) e manda o jogador segui-la.
 7. FUGA PELO PASTO: os dois saem da base e voltam ao pasto, onde começam a vir HORDAS de inimigos grandes que já sabem que ambos estão ali. Vão subindo até o topo da colina, se escondendo e enfrentando inimigos.
 8. HELICÓPTERO: Pen liga de novo avisando que mandou um helicóptero. Ele chega. O jogador sobe pela corda com MOVIMENTOS REAIS (VR).
 9. FINAL: voando perto da ilha, em alta velocidade, o jogador troca tiros com inimigos da ilha, de carro e a pé, até conseguirem fugir. A missão acaba.
 10. ENCERRAMENTO: Emmy revela algumas coisas sobre a facção e está aliviada por ter sido salva, mas não agradece nem se dobra ao jogador.

 --- AS 7 PARTES (cada uma em uma conversa separada, nesta ordem) ---
 PARTE 1: ESTRUTURA E MAPA. Esqueleto do modo história (entrada pelo menu, carregar cena, gatilhos de eventos, checkpoints, sistema de legenda e do quadradinho azul da Pen). Criação do mapa do capítulo 1: terreno, morro com subida, mar à vista, sol, pasto verde, colina final, a base iluminada (exterior e interior), trecho da ilha para o final. Tudo leve para o Quest 2.
 PARTE 2: CRIAÇÃO E LOCALIZAÇÃO DE TUDO. Posicionar no mapa: ponto onde Davi acorda, acampamento dos 3 inimigos com a pistola e as 20 munições, patrulhas do pasto, caixas e munição no chão, inimigos da base, porta trancada da Emmy, rota da fuga, pontos de horda, ponto do helicóptero. Criar os modelos de Emmy, Pen (retrato), inimigos grandes, helicóptero com corda, carros da ilha. Sistema de grana e munição dropada pelos inimigos.
 PARTE 3: ATO 1 JOGÁVEL (abertura até a Pen). Davi acordando, subida do morro sem equipamento, abate furtivo dos 3 inimigos, pegar a pistola, caminhada até a escuta voltar e a primeira fala da Pen. Patrulhas do pasto e economia de munição.
 PARTE 4: ATO 2 JOGÁVEL (base e Emmy). Infiltração na base iluminada, eliminação dos inimigos andando pela base, porta da Emmy, cena dela pegando a pistola (animação) e mandando seguir. Emmy como companheira que segue e atira.
 PARTE 5: ATO 3 JOGÁVEL (fuga e final). Saída da base, hordas de inimigos grandes, subida da colina se escondendo, ligação da Pen, helicóptero, subida pela corda com movimentos reais no VR, tiroteio em alta velocidade contra carros e inimigos da ilha, cena final com as revelações da Emmy.
 PARTE 6: PROCURAR BUGS. Revisão do capítulo inteiro de ponta a ponta: gatilhos que não disparam, travamentos (try/catch no loop VR continua obrigatório), furtivo e detecção, desempenho no Quest 2, celular, checkpoints, balanceamento de munição e grana, falas sobrepostas.
 PARTE 7: PROMPT DE FALAS E INTEGRAÇÃO. Eu entrego ao usuário UM prompt grande para a Arena IA com todas as vozes: personagem, tom de voz, texto e nome exato do arquivo (usando a LISTA DE FALAS). Depois que o usuário gerar a pasta "vozes/", combinamos tudo com o jogo e testamos os gatilhos de áudio.

 --- NOTAS TÉCNICAS DA PARTE 1 (v46) ---
 Entrada: menu JOGAR chama boot('story'); TESTAR chama boot('test'). Um modo por carregamento da página (para trocar, recarregar). O jogador começa SEM equipamento: as armas ficam numa bancada escondida a 3 km (benchP.z=3000). Para dar uma arma na Parte 3, trazer o objeto de volta (ex.: gunHolster/gunHeld, sgBack, rfBack, akBack, knifeHome).
 Segundo bloco de script no fim do arquivo = módulo STORY (objeto global STORY, stub no começo do 1º script). Ganchos no jogo base: loop (altura do chão, velocidade STORY.cfg.walk=1.7, STORY.clamp, STORY.tick), resetAll (vira STORY.respawn), stain (altura), HELI.g e ROPE.vis (escondidos no modo história), plHurt morre e volta ao checkpoint.
 Terreno: grade 4 m, X -160..220, Z -470..110, malha com cor por vértice, física Ammo btHeightfieldTerrainShape (se falhar cai para chão plano, aviso no terminal). STORY.gy(x,z) = altura do chão (bilinear). Mar = plano em y=0. Câmera far=700, névoa .0016.
 Pontos (STORY.pts, [x,z]): spawn(-30,38) camp(18,-118) pen(34,-178) pasto(22,-285) gate(80,-334) base(80,-362) emmy(91,-383) colina(-45,-300) topo(-70,-310, plano para o helicóptero) ilha(-430,-300). Caminho de terra: STORY path nas cores do terreno (PATH). Base: cerca + prédio iluminado, pontos de luz internos, cela da Emmy atrás da porta id 'emmy' (STORY.door('emmy') abre). Ilha: terreno + estrada em anel + prédios, sem física (Parte 2/5 completa).
 Eventos: STORY.ev = lista {id,x,z,r,name,fn}; com name vira checkpoint. Legenda: STORY.say('pen'|'emmy'|'ini'|'sis', texto, {dur, voice:'c1_pen_001.mp3'}); fila sem sobreposição, voz opcional em vozes/ (arquivo ausente não trava). Pen aparece como quadradinho azul 3D preso à cabeça. Debug: STORY.cfg.debug=true mostra avisos de eventos (desligar na Parte 6). Celular: botão 'próx. ponto'; teclado: teclas 1..6 pulam para checkpoints.
 NÃO FEITO na Parte 1 (fica para as próximas): inimigos, itens, grana, modelos de Emmy/Pen/helicóptero/corda/carros, falas reais, colisão de árvores/pedras (só visual).

 --- NOTAS TÉCNICAS DA PARTE 2 (v47 a v53) ---
 Inimigos: lista em S.build (12 inimigos: 3 acampamento, 3 pasto, 6 base), todos com o.sty=1 (dropam grana/munição ao morrer: S.money, pocket) e patrulha S.patrol(o,x,z) (raio 7 acampamento, 12 pasto, 3 base; o.pat/o.pi). Patrulha roda em S.tick só quando o.aw===0 e o.ms==='idle'.
 Pistola + 20 munições: caixa verde no acampamento (S.stash, evento 'pistola' chama S.give). Caixas de munição: S.ammo (8, +12 cada).
 Emmy: S.emmy = objeto makeEnemy (look mulher loira), o.ally=1 (isE ignora aliados), hp 1e6, na cela (91,-384.5). Porta 'emmy' abre quando o jogador chega a 2,5 m (S.door). A animação dela pegando a pistola e seguindo o jogador é da Parte 4.
 Grandes: makeEnemy escala a cápsula quando L.s>.97 (o.ck). Horda: S.horde(pontos); pontos prontos em S.hordePts {colina, fuga1, fuga2} (colina é disparada pelo evento; fuga1/fuga2 ficam para a Parte 5).
 Helicóptero: HELI.g no topo (-70,-310), colisão invisível (3 caixas), corda curta amarrada na porta direita (S.heliRope, grupo filho de HELI.g). A Parte 5 troca por corda comprida que desce quando o helicóptero chega.
 Carros da ilha: S.cars (4 carros na estrada, gerados com RESCAR.mk(id)), estáticos, sem física. Inimigos e tiroteio da ilha são Parte 5 (a ilha não tem física).
 Pen: retrato azul (Parte 1) é o modelo dela; falas reais na Parte 3.
 Visual da Emmy (v54): look em S.build (parâmetros L.ex/eye/hc/tip/hl/fr/crop/trimC/acc); acessórios criados por accMk() (brincos, tiara com laço, gargantilha, corrente, xuxinha, pulseiras, saia plissada) presos aos ossos; textura de rosto própria (faceTex com ex) e olho azul (eyeTex com cor).

 --- NOTAS TÉCNICAS DA PARTE 3 (v55 e v56) ---
 Abertura: tela clareia, pisca e abre (S.ws/S.wk). Pen: 3 falas c1_pen_001..003 no ev 'pen' com chiado de rádio (WebAudio).
 Faca: knifeLay(p,q) (1º script) deixa a faca no mundo como corpo cinemático; kState() diz se está na mão/bainha. Toco em S.kRock (-1.5,-86). Ao ser pega, S.kn=1. SUPOSIÇÃO: faca no toco não estava na bíblia; confirmar.
 Pistola: benchGun é movido para a caixa verde (23,-112) em S.build; benchAll() a deixa lá (gunState 'benched'); no Quest o GRIP perto dela chama grabGun. No celular (fallback) pega sozinha a 2,2 m. S.gunGot=1 ao pegar e entra S.addAmmo(8). S.give() só serve para fallback e respawn.
 Furtivo do acampamento: S.en[0..2] (os 3 do acampamento) recebem S.route(o,pts,i0,espera,olhar), o.dm=.75 e o.q virado para -z. Patrulha em S.tick: ao chegar no ponto espera o.pwt s parado olhando para o.lk. o.dm multiplica visão e audição em stealthTick.
 Pasto: 2 duplas (S.en) em rotas retangulares. Munição: S.addAmmo(n) completa pentes e respeita S.ammoCap=6 pentes; S.ammo[i].userData.n (caixa 12, solta 6). Drops: S.money e munição 4-8.
 Subida: S.cfg.walk = 1.7 reduzido pela inclinação (slope) a cada frame em S.tick.
 Respawn (S.respawn): faca volta à bainha se já foi pega, pistola volta ao coldre, mínimo de 8 tiros no bolso.

 Morte: S.respawn() agora só chama S.die() (S.dd = tempo da cena, -1 = fora). Durante a cena PL.hp=1e6, legendas pausadas, movimento travado em S.clamp. UI: plano vermelho dred (renderOrder 1000) + texto dtx (1003) no filho da câmera; fade preto assume em t>3,3 s; em t>4,4 s roda S.doRespawn (antigo respawn). Som: deathSfx() (WebAudio).
 Base: S.en[6..11] = atirador(78,-346), bruto(68,-340), atirador(90,-366), bruto(72,-362), atirador(88,-360), bruto(76,-380), todos com S.route. Checkpoint 'Prédio' em (80,-358) r7.

 --- NOTAS TÉCNICAS DA PARTE 4 (v58) ---
 Holofotes: S.lights (4 torres, cone aditivo, varredura senoidal em S.tick). Detecção: S.lit sobe quando o jogador está dentro do cone (±8,6°, 2 a 40 m) e dentro da plataforma da base; >1,2 s dispara alerta (o.det=1,15, o.tg no jogador) nos inimigos a até 40 m; S.lc = recarga 8 s.
 Emmy: máquina S.es (0 trancada, 1 anda até a mesa e fala, 2 pega a pistola, 3 fala a linha 4, 4 sai pela porta por S.EXIT, 5 pronta/esperando). Aponta a arma usando o.aim (o.aimTo = alvo). Mesa em S.tbl (86,-386,5) com pistola S.tgun. Gatilho: jogador a 2,5 m de (91,-376). A parte de seguir e atirar fica para a próxima.

 --- NOTAS TÉCNICAS DA PARTE 4 (v59) ---
 Emmy companheira: S.es 6 = seguir/atirar (S.emmyAI). Alvo = inimigo mais perto com o.aw>=2 e a menos de 30 m; só atira se estiver virada (dot>.85) e sem parede (blocked). Dano por hurt(o,p,fl,35) + react + burst; rastro tracer; recarga o.ecd. S.emmyTp(x,z) teleporta (usa reset e devolve hp 1e6). S.bk = recarga dos gritos (10 s). Em doRespawn ela vai para perto do checkpoint.

 --- NOTAS TÉCNICAS DA PARTE 4 (v60) ---
 Alarme: S.alarm/S.alt/S.ls (velocidade dos holofotes; fase em S.lp) no S.tick, só para S.en[6..11]. Emmy visível: bloco em S.tick (es>=6) soma o.det com LOS (o.elT/o.elos). S.via(m,p) devolve waypoint de porta/divisória ou null. Eventos aceitam e.cond (função); 'saida' usa cond S.es>=5.

 --- NOTAS TÉCNICAS DA PARTE 4 (v61) ---
 Vida da Emmy: S.eh (0..100), S.eht = tempo sem ser ferida, S.elow = aviso de vida baixa. S.emmyHurt(dmg,pos) aplica o dano, sangue, gritos (S.bk) e chama S.die() se S.eh<=0 (guarda S.dd<0). Em S.tick (es>=5) o bloco 'Inimigos na Emmy' usa o.ec (recarga por inimigo): atirador em alerta (aw>=2) com LOS (blocked) e o.bs[7]->Emmy.bs[2], dot>.5, chance .5-.02*d (min .12); bruto a menos de 1,6 m bate 9. Escolhe a Emmy só se ela está mais perto (de<=dp*1.15) ou o jogador está a mais de 26 m. S.doRespawn restaura S.eh=100.

 --- NOTAS TÉCNICAS (v62) ---
 Sangue na tela: S.bvg (vinheta) e S.bsp (respingos), planos presos à câmera em z=-.35, renderOrder 998, texturas de canvas 512 desenhadas em bloodTex(). S.tick calcula vida=min(100,PL.hp) (fora da cena de morte), S.fl = clarão que sobe quando a vida cai e decai 0,7/s, S.ph = vida do quadro anterior, S.bt = relógio do pulso. Fora do VR a escala acompanha camera.fov e camera.aspect; no VR fica .8x.8.

 --- NOTAS TÉCNICAS DA PARTE 5 (v63) ---
 S.horde(pts) agora devolve o grupo e o guarda em S.hg ({l:lista,done}); S.tick avisa quando todos morrem. S.hq = tempo para a horda fuga1 depois de 'saida' (S.hq>0 conta, ao zerar spawna e vira -1). Evento 'fuga' (25,-295, r10, cond S.es>=6) = checkpoint 'Fuga' + horda fuga2. Evento 'topo' (cond S.es>=6) fala c1_pen_004 e marca S.topo=1 (gancho para o helicóptero chegar na próxima conversa).

 --- NOTAS TÉCNICAS DA PARTE 5 (v64) ---
 HELI.H (fuselagem, exportada) é solta do grupo da base com scene.attach e movida em coordenadas de mundo (rotation.order YXZ; frente = +Z). O pad fica em HELI.g. As 3 caixas de colisão do helicóptero foram removidas. Máquina S.hs: 0 espera, 1 atraso 3 s, 2 voando até T=(-70,gy+6.5,-310), 3 corda descendo (2,5 s), 4 corda pronta (S.hr = pivô da corda na porta, comprimento S.hL), 5 subida automática (não-VR), 6 embarque (escurece), 7 voo até a ilha (-430,-300) com o jogador preso à cabine, 8 parado sobre a ilha (fim provisório). Subida VR em S.heliTick: mão segurando com grip a menos de .4 m do eixo da corda; a diferença da altura local da mão (ctl[k].position.y) vira altura do rig; ropeHang=true enquanto pendurado ou caindo; gravidade própria (S.rv). Respawn zera S.cl/S.rv. Som: S.hsnd() (oscilador 48 Hz com LFO 13 Hz, volume por distância em S.hso). emmyHurt ignora dano com S.hs>=6.

 --- NOTAS TÉCNICAS DA PARTE 5 (v65) ---
 Estados novos de S.hs: 7 voo até (-342,-300) (ponto do círculo, ângulo 0), 8 tiroteio (S.islTick), 9 saída para o oeste (fim provisório). S.islStart() inicia (S.ia ângulo do helicóptero em volta de IC, S.iw onda, S.ip 'pre'|'wave'|'gap', S.it tempo, S.tw tempo da onda, S.waves lista {m,c}). Alvos em S.tg: {k:'m'|'c', alive, hp, r, fc, ...}; homem (S.manAdd, grupo S.mg compartilhado, em x,z sobre a estrada r=62±2,5, y=hI+.08), carro (S.cars[id] com c.a ângulo, c.w velocidade angular, c.off posição relativa, S.carPlace(c); a frente do carro é o +X local, anda no sentido de a crescente). S.tpos(t,out) dá o centro do alvo. Tiro do jogador: shoot() foi embrulhado em S.start (só com S.hs===8, usa muz/camera) e chama S.shotHit (raio contra esferas, até 130 m). S.kill(t), S.boom() (som), S.fx = chamas. S.clearTg() limpa. Respawn com S.hs===8 chama S.islReset (volta à 1ª onda). S.bk é decrementado em S.islTick (a Emmy está a bordo).

 --- NOTAS TÉCNICAS DA PARTE 5 (v66) ---
 S.emmyPin(H,p,mode) prende o corpo da Emmy na cabine (offset local +.45,+.15, altura H.y+.2) escrevendo direto num btTransform persistente (S.pt/S.pv/S.pq; NÃO usar setT por quadro, ele aloca) e zerando a velocidade; mode 'player' faz ela olhar para o jogador. Sequência final: S.hs 9 (voo para o oeste, espera 2,5 s e as legendas esvaziarem) -> S.finale() enfileira as falas e vai a 10 -> quando a fila esvazia vai a 11, escurece e depois de 2,2 s S.endCard() desenha o cartão no mesmo plano da tela de morte (dtx) e deixa PL.hp=1e6. Estado 11 é final (nada mais acontece).

 ===== CAPÍTULO 2: BÍBLIA DO PROJETO (instrução permanente para o Claude, vale em TODAS as conversas do capítulo 2) =====
 O capítulo 2 segue o MESMO FORMATO do capítulo 1: 7 partes, cada uma em conversa separada, mesmas regras de versionamento, mesmo padrão de vozes na Arena IA. Tudo que está acima (PRINCÍPIOS FIXOS P1 a P5, personagens, sistemas e NOTAS TÉCNICAS do capítulo 1) continua valendo. Este bloco só acrescenta o que é do capítulo 2.
 Diferenças em relação ao capítulo 1 (pedido do usuário): (a) MAIS LIBERDADE para eu desenvolver o drama; (b) foco em TEMAS ADULTOS; (c) o capítulo é BEM MAIOR: mais inimigos, mapa bem mais longo e recheado de árvores (mata fechada). Cada parte provavelmente vai precisar de mais de uma conversa; nesse caso salvar versões intermediárias do tipo "PARTE N (~X%)", como no capítulo 1.

 --- PRINCÍPIOS DO CAPÍTULO 2 ---
 C2-P1. VOZES: pasta "vozes/" (a mesma), arquivo "c2_<personagem>_<NNN>.mp3" (c2 = capítulo 2; ex.: c2_emmy_001.mp3, c2_pen_001.mp3, c2_comerciante_003.mp3, c2_inimigo_012.mp3). Nunca renomear arquivo já combinado. Os arquivos c1_ continuam como estão. A Parte 7 entrega UM prompt grande para a Arena IA (personagem, tom de voz, texto, nome exato), igual ao capítulo 1. Arquivo ausente nunca pode travar o jogo.
 C2-P2. LINGUAJAR E TOM: continua ADULTO, com muito palavrão, personalidades fortes. Com a liberdade nova: drama pesado (perda, culpa, trauma, medo, humilhação, exploração de pessoas, violência explícita no estilo do gore que o jogo já tem). Nada de cena sexual explícita. DAVI continua MUDO: só os outros falam com ele ou sobre ele. Emmy continua sem agradecer ou se curvar ao jogador, mesmo vulnerável.
 C2-P3. O que o usuário NÃO definiu e eu inventei está marcado como PROPOSTA nesta bíblia (e vira SUPOSIÇÃO no log da versão quando for implementado). O usuário pode trocar qualquer PROPOSTA. As decisões grandes estão em DECISÕES TOMADAS (D1 a D9, sem pergunta aberta). Se surgir uma dúvida nova importante durante uma parte, o Claude decide pela proposta mais coerente com esta bíblia e registra como SUPOSIÇÃO no log da versão, em vez de parar a conversa (o usuário só manda "continue o que falta").
 C2-P4. DESEMPENHO NO QUEST 2 é a prioridade técnica do capítulo, porque o mapa é bem maior e tem mata fechada: árvores em InstancedMesh (poucos modelos, 2 níveis de detalhe + bilboard longe), mapa em blocos (chunks) que aparecem/somem por distância, inimigos só ativos perto do jogador (os longes ficam congelados/ocultos), nenhuma luz nova por árvore, sombras só no que está perto, névoa para esconder o corte de distância. Meta: sem queda de quadros mesmo na parte mais cheia (perseguição de carro).
 C2-P5. COLISÃO DE ÁRVORES E PEDRAS: no capítulo 1 árvores e pedras eram só visuais. No capítulo 2 elas PRECISAM bloquear (jogador, inimigos, Emmy e CARRO), porque a perseguição exige desviar. PROPOSTA técnica: não criar um corpo de física por árvore; usar grade espacial (hash) de círculos de tronco/pedra e testar só os vizinhos de quem se move; para o carro, avaliar na Parte 1 como o carro da arena (v95, com HP e explosão) funciona e como ligá-lo ao mapa novo.

 --- PERSONAGENS NOVOS / MUDANÇAS ---
 DAVI: continua "Ceifador", mudo. EQUIPAMENTO no começo do capítulo 2 (DECIDIDO pelo usuário, D2): SÓ UMA PISTOLA, nada mais, até comprar outras coisas na loja (o comerciante). Sem faca, sem colete, sem acessórios (reaproveita a regra do v93). Munição da pistola (decisão do Claude): 1 pente com 12 tiros e bolso vazio.
 EMMY: continua companheira, voz fina, estressada, patricinha, sem agradecer. No capítulo 2 ela é separada de Davi por boa parte do mapa e mostra RACHADURAS: medo, cansaço, culpa, raiva. Continua armada com a pistola dela. Na perseguição de carro ela atira como passageira.
 PEN: do governo, pelo rádio, quadradinho azul. DECIDIDO (D3, o usuário deixou com o Claude): o contato cai com a queda e ela aparece POUCO, para o capítulo ser de isolamento: (1) logo depois da queda, só chiado e uma frase cortada, sem conseguir ouvir o Davi; (2) uma ligação curta depois do reencontro com a Emmy no posto avançado: ela captou o sinal, avisa que não tem como mandar helicóptero nem apoio e que eles estão por conta própria (e que a ordem é achar o líder); (3) uma frase curta quando o carro chega perto da mansão, com o sinal voltando falhado. Total de 3 a 4 falas da Pen no capítulo.
 COMERCIANTE (novo): vive sozinho na mata, compra a caça do Davi e vende coisas. Personalidade forte e diferente de todos (nome, aparência, voz = definir com o usuário na Parte 2; PROPOSTA de tom: desconfiado, mercenário, falador, humor ácido, sem lado nenhum na guerra, só quer lucro). Comerciante NÃO é da facção.
 LÍDER DA FACÇÃO: NÃO aparece neste capítulo. Só o rastro dele (informações, ordens, o lugar). Nome e rosto ficam para depois (DECISÃO PENDENTE D6).
 INIMIGOS: mesma família do capítulo 1 (atiradores, brutos, grandes, civis), em quantidade bem maior. PROPOSTA de tipos novos: vigias em torre/plataforma com binóculo e rifle; caçadores de patrulha na mata (andam mais devagar, ouvem mais, veem menos por causa das árvores); motoristas/atiradores em caminhonete na perseguição. Mais tons de voz = mais gritos novos (lista de falas do capítulo 2).
 ANIMAIS (novo): caçar e vender. Tipos (PROPOSTA do Claude, valores provisórios): javali (ataca de frente se ferido, vale médio), cervo (foge, vale médio), onça (rara, ataca por trás, vale alto), coelho/ave (fáceis, valem pouco). DECIDIDO (D4): o jogador CARREGA A CARCAÇA NAS COSTAS e a entrega ao comerciante. Detalhes (decisão do Claude): uma carcaça por vez; carregada nas costas deixa o Davi mais lento e impede correr, e sai da mão que segura a arma; no VR pega com o GRIP e leva às costas/ombro, solta com o GRIP; no celular chega perto e pega por toque/botão, solta pelo mesmo gesto; a entrega é soltar a carcaça na área de venda do comerciante, que paga na hora com o dinheiro do jogo (S.money). Se o jogador morrer, a carcaça se perde. Carcaça fica no mundo se for largada (sem apodrecer).

 --- HISTÓRIA DO CAPÍTULO 2 (o que o usuário definiu, fiel) ---
 1. QUEDA: o helicóptero em que Davi e Emmy estão, de alguma forma, cai numa ilha próxima. Essa ilha está recheada de inimigos.
 2. SEPARAÇÃO: Davi e Emmy sobrevivem à queda, mas se separam de novo.
 3. DAVI SOZINHO: a ilha é mata fechada. Há animais que o jogador pode matar e vender. Ao andar um pouco, Davi encontra o comerciante.
 4. COMBATE E CAMINHADA: Davi enfrenta muitos inimigos e anda bastante.
 5. RÁDIO DA EMMY: Emmy manda uma mensagem para Davi pelo rádio pedindo para encontrá-la em algum lugar. Nesse lugar há informações sobre o líder da facção.
 6. CARRO: eles acham um carro e percorrem bastante a ilha com ele, mas são perseguidos. Davi pilota e tem que ser manobrista, esquivando de árvores e pedras, enquanto Emmy atira.
 7. CHEGADA: chegam a um local onde acreditam que o líder está; pode ser uma mansão. (Fim do capítulo.)
 FUTURO DO JOGO (só anotado, NÃO implementar agora): em algum momento mais para frente aparecem RELIGIOSOS EXTREMISTAS; esta facção pode ter uma pequena ligação com eles. Esses religiosos só aparecem bem depois. PROPOSTA: no máximo UMA pista discreta e sem explicação neste capítulo (por exemplo um símbolo desenhado no lugar das informações, sem ninguém comentar). Confirmar (DECISÃO PENDENTE D5).

 --- DESENVOLVIMENTO DO DRAMA (PROPOSTA do Claude, a confirmar; usa a liberdade que o usuário deu) ---
 Tom do capítulo: no capítulo 1 a Emmy era salva e mandona; no capítulo 2 os dois estão sem ajuda, perdidos, e o drama é ISOLAMENTO + PREÇO DA MISSÃO. Linha dramática em 6 batidas, cada uma amarrada a uma parte do mapa:
 B1. DESTROÇOS. Davi acorda no meio do helicóptero caído, queimando, com corpos da tripulação (adulto e pesado: o piloto morreu na queda). Silêncio, fogo, mar ao longe. Nada de Emmy. Sem Pen (chiado). O jogador entende que agora é sobrevivência.
 B2. A MATA. Mata fechada, abafada, sons de bicho e de longe tiros. Caçar para ter dinheiro e munição. Primeiros caçadores da facção procurando os sobreviventes da queda (a facção sabe que caíram).
 B3. O COMERCIANTE. Primeira pessoa que fala com o Davi no capítulo: cínico, tem preço para tudo, comenta o que vê em Davi (as cicatrizes, a faca, o jeito) sem o Davi nunca responder. Ele já viu a facção fazer coisas piores do que uma queda de helicóptero e deixa isso escapar. É a primeira pista de que a ilha tem gente EXPLORADA, não só soldados.
 B4. O CAMINHO. Mais acampamentos e emboscadas. PROPOSTA: um trecho com prisioneiros civis exploradas (trabalho forçado/cativos) que o jogador pode soltar ou deixar. DECIDIDO (D1): o cativeiro ENTRA. Soltar os prisioneiros exige matar os guardas e abrir a jaula/porta; eles fogem pela mata (nenhum vira aliado neste capítulo). A escolha (soltar ou deixar) é guardada numa marca (S.freed) que muda as falas do Comerciante e da Emmy depois, e fica salva para o capítulo 3. Cada fala que depende disso tem duas versões na lista de falas (sufixo _a = soltou, _b = deixou).
 B5. REENCONTRO. A mensagem da Emmy chega pelo rádio cansada, quase sem a voz de patricinha ("vem logo, porra, eu não tô bem"). Ela está no lugar das informações. PROPOSTA do lugar: um posto avançado/galpão de comunicações da facção com mural de fotos, mapas, ordens, nome de operações e fotos de pessoas desaparecidas. Entre elas, o parceiro de investigação dela, que ela acreditava vivo. Emmy desaba por um instante e logo se recompõe com raiva, SEM agradecer. A informação final do lugar: onde o líder está (a mansão) e que a ordem dele é pegar os dois vivos.
 B6. A FUGA DE CARRO E A MANSÃO. Perseguição brutal, os dois dependendo um do outro: ele dirige (mudo), ela grita, atira, xinga, recarrega. No final, o carro (talvez destruído, talvez fumegando) para diante de uma mansão enorme no alto. Silêncio, luzes acesas, nenhuma defesa à vista, o que é pior. Fecha o capítulo com o cartão "FIM DO CAPÍTULO 2" (PROPOSTA: mesmo estilo do cartão do capítulo 1).
 Gancho do capítulo 3 (PROPOSTA): o líder sabia que eles chegariam.

 --- MAPA DO CAPÍTULO 2 (PROPOSTA de zonas, na ordem em que o jogador passa) ---
 Tamanho: bem maior que o do capítulo 1 (que tem ~380 x 580 m). PROPOSTA: da ordem de 900 x 1300 m, ajustável na Parte 1 conforme o desempenho. Relevo variado, mata fechada quase o mapa todo, clareiras, pedras, riacho/lagoa, trechos de estrada de terra.
 Z1 PRAIA DOS DESTROÇOS: helicóptero caído em chamas, fumaça, mar, corpos, detritos. Ponto onde Davi acorda.
 Z2 MATA FECHADA: trilhas estreitas, árvores muito juntas, caça (animais) e primeiros caçadores da facção.
 Z3 CLAREIRA DO COMERCIANTE: barraca/cabana, fogueira, carroça ou caminhonete velha, ponto seguro (checkpoint). Compra e venda.
 Z4 MATA PROFUNDA COM ACAMPAMENTOS: 3 a 5 acampamentos/postos espalhados (furtivo possível), torres de vigia, patrulhas, trecho do cativeiro (B4), pontes/troncos, pedras grandes.
 Z5 PONTO DE ENCONTRO COM A EMMY: posto avançado da facção (B5), com cena e informações. Checkpoint.
 Z6 GARAGEM/ESTRADA: onde está o carro; começo da perseguição. Checkpoint antes de entrar no carro.
 Z7 PERCURSO DO CARRO: estrada de terra sinuosa por entre árvores e pedras (TRECHO CURTO DE REFERÊNCIA a definir; é onde a colisão de árvores/pedras precisa estar perfeita), com trechos largos e estreitos, rampas, curva fechada, ponte. Perseguidores em caminhonetes, motos? (D7).
 Z8 MANSÃO: terreno alto, portão, jardim e fachada (só exterior neste capítulo). Interior fica para o capítulo 3, salvo decisão do usuário.
 Horário do dia (PROPOSTA): começa à tarde, entardecer na parte do carro, quase noite na chegada à mansão, para dar clima. Cuidado com desempenho (sem luz extra por poste/lampião, usar emissivo e textura).

 --- AS 7 PARTES DO CAPÍTULO 2 (cada uma em uma conversa separada, nesta ordem; se uma parte for grande demais, dividir em versões intermediárias dentro dela) ---
 PARTE 1: ESTRUTURA E MAPA. (a) Entrada do capítulo 2: o cartão final do capítulo 1 passa a levar ao capítulo 2 (PROPOSTA: botão/toque de continuar no cartão, e no menu um jeito de escolher CAPÍTULO 1 ou CAPÍTULO 2); generalizar o módulo STORY para vários capítulos SEM quebrar o capítulo 1 (STORY.ch, mapa/eventos por capítulo). (b) Terreno novo grande com relevo, mar ao redor, praia, mata, clareiras, estrada de terra, colina da mansão; mata fechada com árvores em instâncias (C2-P4); chunks por distância. (c) Colisão de árvores e pedras por grade espacial (C2-P5), válida para jogador, inimigos, Emmy e carro. (d) Eventos, checkpoints e pontos (Z1 a Z8), legenda, quadradinho azul da Pen, fila de falas (reaproveitar o que existe). (e) Mansão só o exterior básico, o posto avançado (Z5) e a clareira do comerciante só como volumes. Jogador começa com o equipamento definido em D2.
 PARTE 2: CRIAÇÃO E LOCALIZAÇÃO DE TUDO. Posicionar no mapa: destroços do helicóptero (Z1), ponto onde Davi acorda, animais por região, comerciante e sua cabana (com a estrutura de compra/venda), todos os acampamentos, torres de vigia, patrulhas, cativeiro, caixas/munição/grana no chão, posto avançado com mural e informações (Z5), carro (Z6) e caminhonetes perseguidoras, mansão exterior (Z8). Criar os modelos: comerciante, animais, caçadores/vigias novos, caminhonetes, carro da fuga (reaproveitar o carro da arena v95, com HP), helicóptero caído, mural de fotos. Quantidade de inimigos: no mínimo o dobro do capítulo 1 (PROPOSTA: de 50 a 80 a pé espalhados, ativados por distância, mais hordas e carros), validada no Quest 2. Sistema de caça (matar, carcaça, valor) e de venda no comerciante, usando S.money (e, se a loja do modo teste v94 for reaproveitada, os mesmos itens/preços; ver D4 e D8).
 PARTE 3: ATO 1 JOGÁVEL (queda e Davi sozinho). Abertura da queda (cena curta do helicóptero caindo, tela escurecendo e Davi acordando nos destroços), batida B1; mata fechada e caça de animais (B2); primeiros caçadores da facção com furtivo e tiroteio; encontro com o comerciante, compra/venda funcionando, falas dele (B3). Davi ainda sem a Emmy. Economia de munição e de grana ajustada para um mapa maior.
 PARTE 4: ATO 2 JOGÁVEL (mata profunda, rádio da Emmy, reencontro). Combate em acampamentos, torres, patrulhas, cativeiro (B4, se aprovado), enfrentando muitos inimigos e andando bastante; mensagem de rádio da Emmy pedindo para encontrá-la (a mensagem chega em um momento certo, com chiado e legenda); caminho até o posto avançado; REENCONTRO com a Emmy e a cena dramática com as informações sobre o líder (B5). Emmy volta a ser companheira (seguir e atirar, reaproveitando o que já existe do capítulo 1 mas adaptado à mata e às árvores).
 PARTE 5: ATO 3 JOGÁVEL (carro, perseguição e mansão). Achar o carro, entrar e DIRIGIR em VR/celular com controle bom o bastante para desviar de árvores e pedras; Emmy como passageira atirando nos perseguidores (caminhonetes e atiradores), diálogos curtos durante a corrida, o carro sofrendo dano (usar HP/fumaça/fogo do v95); trecho de percurso com rampas e curvas; chegada à mansão e cena final com cartão "FIM DO CAPÍTULO 2" (B6). Morrer volta ao checkpoint certo (antes do carro ou do trecho da perseguição).
 PARTE 6: PROCURAR BUGS. Revisão do capítulo de ponta a ponta: gatilhos que não disparam, travamentos (try/catch no loop VR continua obrigatório), furtivo e detecção na mata, colisão de árvores/pedras (jogador, inimigo, Emmy e carro nunca travam nem atravessam), caça e venda, desempenho no Quest 2 e no celular (principalmente a perseguição e as clareiras com muitos inimigos), checkpoints, balanceamento de munição e grana, falas sobrepostas, estados do carro (HP, explosão, não prender a Emmy).
 PARTE 7: PROMPT DE FALAS E INTEGRAÇÃO. UM prompt grande para a Arena IA com todas as vozes do capítulo 2 (personagem, tom, texto, nome exato c2_...), baseado na LISTA DE FALAS DO CAPÍTULO 2. Depois que o usuário gerar a pasta "vozes/", integrar e testar os gatilhos de áudio, igual ao capítulo 1. Anotar arquivos que o filtro bloquear (o capítulo 1 teve um, c1_inimigo_014) e regerar sozinhos.

 --- DECISÕES TOMADAS DO CAPÍTULO 2 (sem perguntas abertas; quem decidiu está indicado) ---
 D1 (usuário): o cativeiro de civis explorados ENTRA. Soltar ou deixar muda falas do Comerciante e da Emmy (marca S.freed, versões _a/_b), sem mudar o resto da história. Fica no trecho da mata profunda (Z4).
 D2 (usuário): equipamento do Davi = só uma pistola até comprar mais coisas na loja. (Claude: 12 tiros no pente, bolso vazio; sem faca nem acessórios.)
 D3 (Claude, por autorização do usuário): Pen aparece pouco (3 a 4 falas): chiado após a queda, ligação curta no posto avançado dizendo que não há apoio, frase curta perto da mansão.
 D4 (usuário): carcaça nas costas, entregue ao comerciante. Regras de detalhe em ANIMAIS acima (uma por vez, mais lento, sem correr, pago na hora).
 D5 (Claude): a pista dos religiosos ENTRA como UM detalhe discreto: um símbolo desenhado/pendurado no posto avançado (Z5), sem ninguém comentar e sem explicação. Nada além disso no capítulo.
 D6 (Claude): o líder aparece só como silhueta/foto riscada no mural do posto avançado, SEM nome e SEM rosto. Nome e rosto ficam para o capítulo 3.
 D7 (usuário): perseguidores = caminhonetes (atiradores na caçamba), motos e, no final, um CARRO BLINDADO. Claude: sem tempo limite, a perseguição dura até chegar na mansão; motos são rápidas e tentam emparelhar; caminhonetes batem de lado e atiram; o blindado tem HP muito alto (usa o sistema de HP/fumaça/fogo do v95, mas com pneus e motorista como ponto fraco) e pode bater em árvores e pedras como o jogador; a Emmy atira e grita avisos.
 D8 (Claude, a partir do pedido do usuário de "comprar na loja"): o COMERCIANTE É A LOJA DA HISTÓRIA. Reaproveita a loja do modo teste (v94: menu em tela cheia, preços, compra com S.money) e vende o que existe lá (facas, munição, pistolas, silenciador, pentes, mira, AK, sniper, espingarda, rifles, coletes). É o único lugar da história onde os acessórios entram (v93). Compra a caça. O visual do comerciante é DIFERENTE do vendedor mascarado do modo teste (personagem próprio). O balcão vira a cabana na Z3.

 ===== CAPÍTULO 3: PLANO COMPLETO (registrado na v115; SÓ DOCUMENTAÇÃO, nenhuma mudança de jogo) =====
 LEIA JUNTO COM A BÍBLIA ACIMA (princípios P1 a P5 valem iguais) E COM OS BLOCOS DO CAPÍTULO 2. O usuário pediu, nesta etapa, SÓ para salvar a história e o que fazer em cada uma das 8 partes. NÃO implementar nada até ele pedir a PARTE 1. Uma parte por conversa; ao terminar, esperar ele pedir a próxima.

 --- REGRAS DO CAPÍTULO 3 ---
 R1. Mesmo formato dos capítulos 1 e 2: partes em conversas separadas, arquivo novo res_vN.html a cada versão, STATUS DAS PARTES e LISTA DE FALAS atualizados ao fim de cada parte, Davi mudo, jogo adulto com muito palavrão, tela limpa sem HUD, desempenho no Quest 2 em primeiro lugar, try/catch no loop VR.
